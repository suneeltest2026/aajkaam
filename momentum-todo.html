<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="ic" data-icon="grid" aria-hidden="true"></span></div>
      <div>
        <h1>Momentum</h1>
        <p>Priority matrix</p>
      </div>
    </div>
    <nav class="segmented" id="viewSwitch" role="tablist" aria-label="Choose a view">
      <button role="tab" data-view="prio" aria-selected="true"><span class="ic" data-icon="grid"></span>Priority</button>
      <button role="tab" data-view="cats" aria-selected="false"><span class="ic" data-icon="layers"></span>Areas</button>
      <button role="tab" data-view="all" aria-selected="false"><span class="ic" data-icon="list"></span>All</button>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" title="Light or dark appearance" aria-label="Toggle dark mode"></button>
      <button class="icon-btn" id="settingsBtn" title="Rename areas, groups and labels" aria-label="Settings"><span class="ic" data-icon="gear"></span></button>
      <button class="btn primary" id="addBtn"><span class="ic" data-icon="plus"></span>New task</button>
    </div>
  </header>
  <main id="main"></main>
  <p class="foot">Saved automatically in this browser. No account, no internet needed.</p>
</div>
<button class="fab" id="fabBtn" aria-label="Add a new task"><span class="ic" data-icon="plus"></span></button>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="taskModal" hidden></div>
<div class="overlay" id="setModal" hidden></div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
var KEY = "momentum.eisenhower.v2";
var OLD_KEY = "momentum.eisenhower.v1";
var PALETTE = ["#3B5BDB","#0B7285","#2F9E44","#B7791F","#C2255C","#6741D9","#1971C2","#5C7080"];
var OLD_COLORS = {"#6366f1":"#3B5BDB","#ec4899":"#C2255C","#10b981":"#2F9E44","#f59e0b":"#B7791F",
                  "#0ea5e9":"#1971C2","#8b5cf6":"#6741D9","#ef4444":"#C2255C","#14b8a6":"#0B7285"};
var NEW_ICONS = ["✨","🎯","🧭","🎨","🏡","🌱","🛠️","📚"];
var SUB_ICONS = ["📌","🗂️","📎","⭐"];

/* ---- icon set: monochrome line glyphs, sized by font-size ---- */
function sv(inner){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '+
    'stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}
var ICON = {
  grid:  sv('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/>'+
            '<rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>'),
  list:  sv('<path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><path d="M3.8 6h.01M3.8 12h.01M3.8 18h.01" stroke-width="2.4"/>'),
  moon:  sv('<path d="M20.8 13.4A8.6 8.6 0 1 1 10.9 3.4a6.8 6.8 0 0 0 9.9 10z"/>'),
  sun:   sv('<circle cx="12" cy="12" r="4"/><path d="M12 2.6v2.2M12 19.2v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6'+
            'M2.6 12h2.2M19.2 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>'),
  gear:  sv('<path d="M4 7h7M15 7h5M4 17h5M13 17h7M4 12h3M11 12h9"/><circle cx="13" cy="7" r="2.1"/>'+
            '<circle cx="11" cy="17" r="2.1"/><circle cx="9" cy="12" r="2.1"/>'),
  plus:  sv('<path d="M12 5.5v13M5.5 12h13"/>'),
  search:sv('<circle cx="11" cy="11" r="6.6"/><path d="M19.6 19.6l-3.9-3.9"/>'),
  filter:sv('<path d="M4 5.5h16l-6.3 7.4v5.6l-3.4-1.9v-3.7z"/>'),
  pencil:sv('<path d="M4.5 19.5h3.6L19 8.6a2.55 2.55 0 0 0-3.6-3.6L4.5 15.9v3.6z"/>'),
  trash: sv('<path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7"/>'),
  chev:  sv('<path d="M9.5 5.5l6.5 6.5-6.5 6.5"/>'),
  left:  sv('<path d="M19 12H5.4M11 5.6L4.8 12l6.2 6.4"/>'),
  check: sv('<path d="M4.6 12.6l5 5L19.4 6.9"/>'),
  cal:   sv('<rect x="3.4" y="5.2" width="17.2" height="15.4" rx="2.6"/><path d="M8 3v4M16 3v4M3.4 10h17.2"/>'),
  clock: sv('<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2v5.2l3.4 2"/>'),
  inbox: sv('<path d="M3.4 13.4h4.7l1.5 2.9h4.8l1.5-2.9h4.7"/><path d="M6 4.6h12l3 8.8v6H3v-6z"/>'),
  x:     sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  layers:sv('<path d="M12 3.4l8.4 4.3L12 12 3.6 7.7z"/><path d="M3.6 12.2L12 16.5l8.4-4.3M3.6 16.4L12 20.7l8.4-4.3"/>')
};
function ic(name){ return '<span class="ic" aria-hidden="true">'+(ICON[name]||"")+'</span>'; }

/* the quadrant's own glyph: the matrix with its cell filled */
function quadGlyph(qid){
  var i = {q1:0,q2:1,q3:2,q4:3}[qid] || 0;
  var cells = [[3.4,3.4],[13.2,3.4],[3.4,13.2],[13.2,13.2]], out = "";
  cells.forEach(function(c,k){
    out += '<rect x="'+c[0]+'" y="'+c[1]+'" width="7.4" height="7.4" rx="1.8" '+
      (k===i ? 'fill="currentColor" stroke="none"' : 'stroke="currentColor" stroke-opacity=".38" stroke-width="1.5"')+'/>';
  });
  return '<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none">'+out+'</svg></span>';
}

/* status glyphs: dotted ring, half filled, filled with a tick */
function statusGlyph(sid){
  var inner;
  if(sid === "done"){
    inner = '<circle cx="12" cy="12" r="8.4" fill="currentColor" stroke="none"/>'+
            '<path d="M8.2 12.3l2.6 2.6 5.1-5.4" fill="none" stroke="var(--surface)" stroke-width="2.1" '+
            'stroke-linecap="round" stroke-linejoin="round"/>';
  }else if(sid === "doing"){
    inner = '<circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.7"/>'+
            '<path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none"/>';
  }else{
    inner = '<circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.7" '+
            'stroke-dasharray="2.4 2.8" stroke-linecap="round"/>';
  }
  return '<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24">'+inner+'</svg></span>';
}

var QUADS = [
  {id:"q1", name:"Important & Urgent",          hint:"Do it now",              color:"var(--q1)"},
  {id:"q2", name:"Important but Not Urgent",    hint:"Schedule it",            color:"var(--q2)"},
  {id:"q3", name:"Not Important but Urgent",    hint:"Do quick or hand over",  color:"var(--q3)"},
  {id:"q4", name:"Not Important and Not Urgent",hint:"Whenever there is time", color:"var(--q4)"}
];
var STATUS_IDS = ["todo","doing","done"];
var STATUS_COLORS = {todo:"var(--st-todo)", doing:"var(--st-doing)", done:"var(--st-done)"};

function defaults(){
  return {
    categories:[
      {id:"c1", name:"Work", icon:"💼", color:"#3B5BDB", subs:[
        {id:"c1s1",name:"Projects",icon:"📁"},{id:"c1s2",name:"Meetings",icon:"🗣️"},
        {id:"c1s3",name:"Admin",icon:"🗃️"},{id:"c1s4",name:"Growth",icon:"📈"}]},
      {id:"c2", name:"Personal", icon:"🏠", color:"#C2255C", subs:[
        {id:"c2s1",name:"Home",icon:"🏠"},{id:"c2s2",name:"Family",icon:"👨‍👩‍👧"},
        {id:"c2s3",name:"Friends",icon:"🎉"},{id:"c2s4",name:"Fun",icon:"🎮"}]},
      {id:"c3", name:"Health", icon:"🌿", color:"#2F9E44", subs:[
        {id:"c3s1",name:"Fitness",icon:"🏃"},{id:"c3s2",name:"Food",icon:"🥗"},
        {id:"c3s3",name:"Rest",icon:"😴"},{id:"c3s4",name:"Appointments",icon:"🩺"}]},
      {id:"c4", name:"Finance", icon:"💳", color:"#B7791F", subs:[
        {id:"c4s1",name:"Bills",icon:"🧾"},{id:"c4s2",name:"Savings",icon:"🏦"},
        {id:"c4s3",name:"Budget",icon:"📊"},{id:"c4s4",name:"Investing",icon:"📈"}]}
    ],
    statuses:{
      todo:{label:"Not Started", icon:"⚪"},
      doing:{label:"In Process", icon:"🚀"},
      done:{label:"Finished",    icon:"✅"}
    },
    cheer:"Done — nice work.",
    theme: prefersDark() ? "dark" : "light",
    tasks:[],
    seeded:false
  };
}

function seedTasks(){
  var t = Date.now();
  var s = [
    ["Send the quarterly report","c1","c1s1","q1","doing","Almost done — just needs the summary page."],
    ["Plan next month's team goals","c1","c1s4","q2","todo",""],
    ["Reply to newsletter sign-ups","c1","c1s3","q3","todo",""],
    ["Book dentist appointment","c3","c3s4","q1","todo",""],
    ["Weekend trip ideas","c2","c2s4","q4","todo","Somewhere with a lake 🏞️"],
    ["30-minute walk after lunch","c3","c3s1","q2","done",""],
    ["Pay the electricity bill","c4","c4s1","q1","todo",""],
    ["Review savings plan","c4","c4s2","q2","todo",""]
  ];
  return s.map(function(x,i){
    return {id:"t"+(t+i), title:x[0], category:x[1], sub:x[2], quadrant:x[3], status:x[4],
            notes:x[5], due:"", created:t+i, done_at:(x[4]==="done"? t : 0)};
  });
}

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* first run only: start in whatever mode the phone or computer is already using */
function prefersDark(){
  try{
    var stamped = document.documentElement.getAttribute("data-theme");
    if(stamped === "dark") return true;
    if(stamped === "light") return false;
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }catch(e){ return false; }
}

/* ============ state ============ */
var state = load();
var ui = {view:"prio", openCat:null, openSub:null, tab:null, showFilters:false,
          search:"", fCat:"all", fSub:"all", fStat:"all", setMode:null};

function load(){
  var base = defaults(), raw = null, migrated = false;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw){
    try{ raw = localStorage.getItem(OLD_KEY); migrated = !!raw; }catch(e){}
  }
  try{
    var s = raw ? JSON.parse(raw) : null;
    if(s && typeof s === "object"){
      if(Array.isArray(s.categories) && s.categories.length){
        base.categories = s.categories.map(function(c,i){
          var proto = defaults().categories[i % 4];
          var subs = Array.isArray(c.subs) && c.subs.length ? c.subs : proto.subs.map(function(x,j){
            return {id:(c.id||"c")+"s"+(j+1), name:x.name, icon:x.icon};
          });
          var col = c.color || proto.color;
          if(OLD_COLORS[String(col).toLowerCase()]) col = OLD_COLORS[String(col).toLowerCase()];
          return {id:c.id||uid("c"), name:c.name||proto.name, icon:c.icon||proto.icon, color:col, subs:subs};
        });
      }
      if(typeof s.cheer === "string" && s.cheer.trim()) base.cheer = s.cheer;
      base.theme = s.theme === "dark" ? "dark" : "light";
      base.tasks = Array.isArray(s.tasks) ? s.tasks : [];
      base.seeded = !!s.seeded;
      STATUS_IDS.forEach(function(k){
        if(s.statuses && s.statuses[k]){
          if(s.statuses[k].label) base.statuses[k].label = s.statuses[k].label;
          if(s.statuses[k].icon)  base.statuses[k].icon  = s.statuses[k].icon;
        }
      });
    }
  }catch(e){ base = defaults(); }

  if(!base.seeded){ base.tasks = seedTasks(); base.seeded = true; }

  /* every task must point at a category + sub that still exists */
  base.tasks = base.tasks.filter(function(t){ return t && t.title; }).map(function(t){
    var c = null, i;
    for(i=0;i<base.categories.length;i++) if(base.categories[i].id === t.category) c = base.categories[i];
    if(!c) c = base.categories[0];
    var has = false;
    for(i=0;i<c.subs.length;i++) if(c.subs[i].id === t.sub) has = true;
    t.category = c.id;
    if(!has) t.sub = c.subs[0].id;
    return t;
  });
  if(migrated){ try{ localStorage.setItem(KEY, JSON.stringify(base)); }catch(e){} }
  return base;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Could not save — browser storage is full or blocked"); }
}

/* ============ small helpers ============ */
function $(sel,root){ return (root||document).querySelector(sel); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function cat(id){
  for(var i=0;i<state.categories.length;i++) if(state.categories[i].id===id) return state.categories[i];
  return state.categories[0];
}
function catIndex(id){
  for(var i=0;i<state.categories.length;i++) if(state.categories[i].id===id) return i;
  return -1;
}
function sub(catId, subId){
  var c = cat(catId);
  for(var i=0;i<c.subs.length;i++) if(c.subs[i].id===subId) return c.subs[i];
  return c.subs[0];
}
function quad(id){ for(var i=0;i<QUADS.length;i++) if(QUADS[i].id===id) return QUADS[i]; return QUADS[0]; }
function stat(id){ return state.statuses[id] || state.statuses.todo; }
function tasksIn(f){
  f = f || {};
  return state.tasks.filter(function(t){
    return (!f.cat || t.category===f.cat) && (!f.sub || t.sub===f.sub) && (!f.quad || t.quadrant===f.quad);
  });
}
function byId(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null; }
function todayISO(){
  var d = new Date(); d.setHours(0,0,0,0);
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function dueInfo(iso){
  if(!iso) return null;
  var t = todayISO();
  var a = new Date(iso+"T00:00:00"), b = new Date(t+"T00:00:00");
  var days = Math.round((a-b)/86400000);
  var label = a.toLocaleDateString(undefined,{month:"short", day:"numeric"});
  if(days === 0) label = "Today";
  else if(days === 1) label = "Tomorrow";
  else if(days === -1) label = "Yesterday";
  return {days:days, label:label, cls: days<0 ? "overdue" : (days<=2 ? "due-soon" : "")};
}
function pct(n,d){ return d ? Math.round(n*100/d) : 0; }
function countsOf(list){
  var done=0, doing=0;
  list.forEach(function(t){ if(t.status==="done") done++; else if(t.status==="doing") doing++; });
  return {all:list.length, done:done, doing:doing, todo:list.length-done-doing};
}
function barHTML(c){
  if(!c.all) return "";
  return '<i style="width:'+pct(c.done,c.all)+'%;background:'+STATUS_COLORS.done+'"></i>'+
         '<i style="width:'+pct(c.doing,c.all)+'%;background:'+STATUS_COLORS.doing+'"></i>'+
         '<i style="width:'+pct(c.todo,c.all)+'%;background:'+STATUS_COLORS.todo+'"></i>';
}

/* ============ shared pieces ============ */
function statusGroupHTML(t){
  var out = '<div class="status-group" role="group" aria-label="Status">';
  STATUS_IDS.forEach(function(sid){
    var s = stat(sid);
    out += '<button data-act="status" data-id="'+t.id+'" data-status="'+sid+'" '+
           'style="--sc:'+STATUS_COLORS[sid]+'" aria-pressed="'+(t.status===sid)+'" '+
           'title="'+esc(s.label)+'">'+statusGlyph(sid)+'<span>'+esc(s.label)+'</span></button>';
  });
  return out + '</div>';
}

function taskHTML(t, opts){
  opts = opts || {};
  var q = quad(t.quadrant), d = dueInfo(t.due), s = stat(t.status);
  var when = "";
  if(d && t.status !== "done" && (d.days < 0 || d.days <= 2)){
    when = '<span class="t-when '+(d.days < 0 ? "overdue" : "soon")+'">'+
             (d.days < 0 ? "Overdue" : esc(d.label))+'</span>';
  }
  var next = t.status === "todo" ? "doing" : (t.status === "doing" ? "done" : "todo");
  return '<article class="task'+(t.status==="done"?" done":"")+'" data-task="'+t.id+'" '+
      'style="--accent-row:'+q.color+'">'+
    '<button class="t-status" data-act="cycle" data-id="'+t.id+'" style="--sc:'+q.color+'" '+
      'title="'+esc(s.label)+' — tap for '+esc(stat(next).label)+'" '+
      'aria-label="'+esc(s.label)+'. Change to '+esc(stat(next).label)+'">'+statusGlyph(t.status)+'</button>'+
    '<button class="t-open" data-act="open-task" data-id="'+t.id+'">'+
      '<span class="t-title">'+esc(t.title)+'</span>'+
      when+
      '<span class="chev">'+ICON.chev+'</span>'+
    '</button>'+
  '</article>';
}

function listHTML(items, opts, empty){
  if(!items.length) return empty;
  var order = {todo:0, doing:1, done:2};
  items = items.slice().sort(function(a,b){
    if(order[a.status] !== order[b.status]) return order[a.status]-order[b.status];
    if(!!a.due !== !!b.due) return a.due ? -1 : 1;
    if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    return b.created - a.created;
  });
  return '<div class="list">' + items.map(function(t){ return taskHTML(t,opts); }).join("") + '</div>';
}

function emptyHTML(icon, title, text, btn){
  return '<div class="empty"><span class="e-ico">'+icon+'</span><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+
    (btn ? '<button class="btn primary" data-act="add" '+(btn.cat?'data-cat="'+btn.cat+'" ':'')+
           (btn.sub?'data-sub="'+btn.sub+'" ':'')+(btn.quad?'data-quad="'+btn.quad+'" ':'')+
           '>'+ic("plus")+esc(btn.label)+'</button>' : '')+'</div>';
}

function miniStatsHTML(){
  var all = state.tasks, c = countsOf(all), today = todayISO();
  var late = all.filter(function(t){ return t.status!=="done" && t.due && t.due < today; }).length;
  var tiles = [
    {val:"all",     n:c.all,   icon:ic("list"),            label:"All",               color:"var(--accent)"},
    {val:"doing",   n:c.doing, icon:statusGlyph("doing"),  label:stat("doing").label, color:"var(--accent)"},
    {val:"done",    n:c.done,  icon:statusGlyph("done"),   label:stat("done").label,  color:"var(--accent)"},
    {val:"overdue", n:late,    icon:ic("clock"),           label:"Overdue",           color:"var(--q1)"}
  ];
  return '<div class="mini-stats">'+ tiles.map(function(x){
    return '<button class="mstat" data-act="stat" data-val="'+x.val+'" style="--sc:'+x.color+'" '+
      'aria-pressed="'+(ui.view === "all" && ui.fStat === x.val)+'">'+
      x.icon+'<b>'+x.n+'</b>'+esc(x.label)+'</button>';
  }).join("") + '</div>';
}

function greeting(){
  var h = new Date().getHours();
  return h<12 ? "Good morning" : (h<18 ? "Good afternoon" : "Good evening");
}

function crumbHTML(parts){
  return '<div class="crumb">'+ parts.map(function(p,i){
    if(p.act) return '<button class="back" data-act="'+p.act+'"'+
      (p.cat?' data-cat="'+p.cat+'"':'')+(p.sub?' data-sub="'+p.sub+'"':'')+'>'+
      (i?"":ic("left"))+esc(p.label)+'</button>';
    return '<span class="crumb-now">'+esc(p.label)+'</span>';
  }).join('<span class="crumb-sep">/</span>') + '</div>';
}

/* ============ home: everything by priority ============ */
function renderPriorityHome(){
  var today = todayISO();
  var sections = QUADS.map(function(q){
    var all = tasksIn({quad:q.id});
    var open = all.filter(function(t){ return t.status !== "done"; });
    var done = all.length - open.length;
    var late = open.filter(function(t){ return t.due && t.due < today; }).length;

    return '<section class="prio-block" style="--accent-row:'+q.color+'">'+
      '<div class="prio-head">'+
        '<span class="prio-ico">'+quadGlyph(q.id)+'</span>'+
        '<span class="prio-txt"><span class="prio-name">'+esc(q.name)+'</span>'+
          '<span class="prio-hint">'+esc(q.hint)+
            (late ? ' · <b>'+late+' overdue</b>' : '')+
            (done ? ' · '+done+' '+esc(stat("done").label.toLowerCase()) : '')+'</span></span>'+
        '<span class="line"></span>'+
        '<span class="num prio-count">'+open.length+'</span>'+
      '</div>'+
      (open.length
        ? listHTML(open, {area:true}, "")
        : '<button class="row-item dashed" data-act="add" data-quad="'+q.id+'">'+
            '<span class="row-ico">'+ic("plus")+'</span><span class="row-txt">'+
            '<span class="row-name">Nothing in this box</span>'+
            '<span class="row-meta">Add a task here</span></span></button>')+
    '</section>';
  }).join("");

  return '<h2 class="question">What needs doing?</h2>'+
    '<p class="q-sub">'+greeting()+'. Your open tasks, most urgent box first.</p>'+
    sections;
}

/* ============ step 1: which area? ============ */
function renderAreas(){
  var rows = state.categories.map(function(c){
    var list = tasksIn({cat:c.id});
    var open = list.filter(function(t){ return t.status!=="done"; }).length;
    return '<button class="row-item" data-act="open-cat" data-cat="'+c.id+'">'+
      '<span class="row-ico">'+c.icon+'</span>'+
      '<span class="row-txt"><span class="row-name">'+esc(c.name)+'</span>'+
        '<span class="row-meta">'+c.subs.length+' group'+(c.subs.length===1?"":"s")+' · '+
          list.length+' task'+(list.length===1?"":"s")+'</span></span>'+
      (open ? '<span class="row-pill"><span class="num">'+open+'</span> open</span>' : '')+
      '<span class="chev">›</span></button>';
  }).join("");

  return '<h2 class="question">Which area?</h2>'+
    '<p class="q-sub">'+greeting()+'. Choose a part of your life to look inside.</p>'+
    '<div class="rows">'+rows+
      '<button class="row-item dashed" data-act="add-cat">'+
        '<span class="row-ico">'+ic("plus")+'</span><span class="row-txt"><span class="row-name">Add an area</span>'+
        '<span class="row-meta">Starts with four groups</span></span></button>'+
    '</div>'+
    '<button class="quiet-link" data-act="open-settings">'+ic("pencil")+'Rename areas, groups and labels</button>';
}

/* ============ step 2: which group? ============ */
function renderGroups(){
  var c = cat(ui.openCat);
  var rows = c.subs.map(function(sg){
    var list = tasksIn({cat:c.id, sub:sg.id});
    var open = list.filter(function(t){ return t.status!=="done"; }).length;
    return '<button class="row-item" data-act="open-sub" data-cat="'+c.id+'" data-sub="'+sg.id+'">'+
      '<span class="row-ico">'+sg.icon+'</span>'+
      '<span class="row-txt"><span class="row-name">'+esc(sg.name)+'</span>'+
        '<span class="row-meta">'+list.length+' task'+(list.length===1?"":"s")+'</span></span>'+
      (open ? '<span class="row-pill"><span class="num">'+open+'</span> open</span>' : '')+
      '<span class="chev">›</span></button>';
  }).join("");

  return crumbHTML([{label:"All areas", act:"home"},{label:c.name}])+
    '<h2 class="question">Which group in '+esc(c.name)+'?</h2>'+
    '<p class="q-sub">Pick the slice of '+esc(c.name)+' you want to work on.</p>'+
    '<div class="rows">'+rows+
      '<button class="row-item dashed" data-act="add-sub" data-cat="'+c.id+'">'+
        '<span class="row-ico">'+ic("plus")+'</span><span class="row-txt"><span class="row-name">Add a group</span>'+
        '<span class="row-meta">Another slice of '+esc(c.name)+'</span></span></button>'+
    '</div>'+
    '<button class="quiet-link" data-act="edit-cat" data-cat="'+c.id+'">'+ic("pencil")+'Rename this area and its groups</button>';
}

/* ============ step 3: which priority? ============ */
function renderPriorities(){
  var c = cat(ui.openCat), sg = sub(ui.openCat, ui.openSub);
  var rows = QUADS.map(function(q){
    var list = tasksIn({cat:c.id, sub:sg.id, quad:q.id});
    var open = list.filter(function(t){ return t.status!=="done"; }).length;
    return '<button class="row-item" data-act="tab" data-quad="'+q.id+'" style="--accent-row:'+q.color+'">'+
      '<span class="row-ico">'+quadGlyph(q.id)+'</span>'+
      '<span class="row-txt"><span class="row-name">'+esc(q.name)+'</span>'+
        '<span class="row-meta">'+esc(q.hint)+' · '+list.length+' task'+(list.length===1?"":"s")+'</span></span>'+
      (open ? '<span class="row-pill"><span class="num">'+open+'</span> open</span>' : '')+
      '<span class="chev">›</span></button>';
  }).join("");

  return crumbHTML([{label:"All areas", act:"home"},{label:c.name, act:"open-cat", cat:c.id},{label:sg.name}])+
    '<h2 class="question">How urgent and important?</h2>'+
    '<p class="q-sub">'+esc(sg.name)+' — pick a box of the matrix to see its tasks.</p>'+
    '<div class="rows">'+rows+
      '<button class="row-item dashed" data-act="add" data-cat="'+c.id+'" data-sub="'+sg.id+'">'+
        '<span class="row-ico">'+ic("plus")+'</span><span class="row-txt">'+
        '<span class="row-name">Add a task to '+esc(sg.name)+'</span>'+
        '<span class="row-meta">Two quick questions</span></span></button>'+
    '</div>';
}

/* ============ step 4: the tasks themselves ============ */
function renderTaskScreen(){
  var c = cat(ui.openCat), sg = sub(ui.openCat, ui.openSub), q = quad(ui.tab);
  var items = tasksIn({cat:c.id, sub:sg.id, quad:q.id});

  return crumbHTML([{label:"All areas", act:"home"},{label:c.name, act:"open-cat", cat:c.id},
                    {label:sg.name, act:"open-sub", cat:c.id, sub:sg.id},{label:q.hint}])+
    '<section class="cat-head" style="--accent-row:'+q.color+'">'+
      '<span class="cat-emoji">'+quadGlyph(q.id)+'</span>'+
      '<div><h2>'+esc(q.name)+'</h2><div class="cat-sub">'+c.icon+' '+esc(c.name)+' › '+sg.icon+' '+esc(sg.name)+
        ' · '+items.length+' task'+(items.length===1?"":"s")+'</div></div>'+
      '<div class="spacer"></div>'+
      '<button class="btn sm primary" data-act="add" data-cat="'+c.id+'" data-sub="'+sg.id+'" data-quad="'+q.id+'">'+
        ic("plus")+'Add here</button>'+
    '</section>'+
    '<div class="group-title"><span>'+esc(q.hint)+'</span><span class="line"></span>'+
      '<span class="num">'+items.length+'</span></div>'+
    listHTML(items, {tags:false}, emptyHTML(quadGlyph(q.id), "Nothing here yet",
      'No tasks in this box yet.',
      {label:"Add a task here", cat:c.id, sub:sg.id, quad:q.id}));
}

/* ============ all activities ============ */
function filterSummary(n){
  var what = ui.fStat === "all" ? "task" :
             (ui.fStat === "overdue" ? "overdue task" : stat(ui.fStat).label.toLowerCase()+" task");
  var where = ui.fCat === "all" ? "" : " in "+cat(ui.fCat).name +
              (ui.fSub === "all" ? "" : " › "+sub(ui.fCat, ui.fSub).name);
  if(ui.fStat === "all" && ui.fCat === "all" && !ui.search.trim()) return "Showing all "+n+" task"+(n===1?"":"s");
  return "Showing "+n+" "+what+(n===1?"":"s")+where+" of "+state.tasks.length+" total";
}

function renderAll(){
  var term = ui.search.trim().toLowerCase();
  var items = state.tasks.filter(function(t){
    if(ui.fCat !== "all" && t.category !== ui.fCat) return false;
    if(ui.fCat !== "all" && ui.fSub !== "all" && t.sub !== ui.fSub) return false;
    if(ui.fStat === "overdue"){ if(t.status === "done" || !t.due || t.due >= todayISO()) return false; }
    else if(ui.fStat !== "all" && t.status !== ui.fStat) return false;
    if(term && (t.title+" "+(t.notes||"")).toLowerCase().indexOf(term) === -1) return false;
    return true;
  });
  var catChips = '<button class="chip" data-act="fcat" data-val="all" aria-pressed="'+(ui.fCat==="all")+'">All areas</button>'+
    state.categories.map(function(c){
      return '<button class="chip" data-act="fcat" data-val="'+c.id+'" aria-pressed="'+
        (ui.fCat===c.id)+'">'+c.icon+' '+esc(c.name)+'</button>';
    }).join("");
  var subChips = "";
  if(ui.fCat !== "all"){
    var c = cat(ui.fCat);
    subChips = '<div class="toolbar" style="margin-top:-4px"><div class="chips sub-chips">'+
      '<button class="chip" data-act="fsub" data-val="all" aria-pressed="'+
        (ui.fSub==="all")+'">All of '+esc(c.name)+'</button>'+
      c.subs.map(function(s){
        return '<button class="chip" data-act="fsub" data-val="'+s.id+'" aria-pressed="'+
          (ui.fSub===s.id)+'">'+s.icon+' '+esc(s.name)+'</button>';
      }).join("")+'</div></div>';
  }
  var statChips = '<button class="chip" data-act="fstat" data-val="all" aria-pressed="'+(ui.fStat==="all")+'">Any status</button>'+
    STATUS_IDS.map(function(sid){
      return '<button class="chip" data-act="fstat" data-val="'+sid+'" aria-pressed="'+
        (ui.fStat===sid)+'">'+statusGlyph(sid)+esc(stat(sid).label)+'</button>';
    }).join("")+
    '<button class="chip" data-act="fstat" data-val="overdue" style="--c:var(--q1)" aria-pressed="'+
      (ui.fStat==="overdue")+'">'+ic("clock")+'Overdue</button>';

  var openFilters = ui.showFilters || ui.fCat !== "all" || (ui.fStat !== "all" && ui.fStat !== "overdue");
  return '<h2 class="question">All activities</h2>'+
    '<p class="q-sub">Every task in one list. The tags show where each one lives.</p>'+
    miniStatsHTML()+
    '<div class="toolbar" style="margin-top:0">'+
      '<label class="search">'+ic("search")+'<input id="searchInput" type="search" placeholder="Search tasks and notes" value="'+
        esc(ui.search)+'" aria-label="Search tasks"></label>'+
      '<button class="btn" data-act="toggle-filters" aria-pressed="'+openFilters+'">'+ic("filter")+'Filters</button>'+
      '<button class="btn primary" data-act="add">'+ic("plus")+'New task</button>'+
    '</div>'+
    (openFilters ?
      '<div class="toolbar" style="margin-top:0"><div class="chips">'+catChips+'</div></div>'+
      subChips+
      '<div class="toolbar" style="margin-top:-4px"><div class="chips">'+statChips+'</div></div>' : '')+
    '<div class="group-title"><span>'+esc(filterSummary(items.length))+'</span><span class="line"></span>'+
      (ui.fStat!=="all" || ui.fCat!=="all" || ui.search.trim() ?
        '<button class="btn sm ghost" data-act="clear-filters">'+ic("x")+'Clear</button>' : '')+'</div>'+
    listHTML(items, {area:true}, emptyHTML(ui.fStat==="overdue" ? ic("clock") : ic("inbox"),
      ui.fStat==="overdue" ? "Nothing is overdue" : "No tasks match",
      state.tasks.length ? (ui.fStat==="overdue" ? "Every due date is still ahead of you."
                                                 : "Try clearing the filters or the search box.")
                         : "Add your first task to get started.",
      {label:"Add a task"}));
}

function render(){
  try{ paint(); }
  catch(err){
    var m = $("#main");
    if(m) m.innerHTML = '<div class="empty"><span class="e-ico">'+ic("inbox")+'</span><h3>Something went wrong drawing this view</h3>'+
      '<p>'+esc(String(err && err.message ? err.message : err))+'</p>'+
      '<button class="btn primary" data-act="home">Back to my areas</button></div>';
  }
}

function paint(){
  document.documentElement.setAttribute("data-theme", state.theme);
  $("#themeBtn").innerHTML = ic(state.theme === "dark" ? "sun" : "moon");
  var m = $("#main");
  if(ui.view === "prio") m.innerHTML = renderPriorityHome();
  else if(ui.view === "all") m.innerHTML = renderAll();
  else if(ui.openCat && ui.openSub && ui.tab) m.innerHTML = renderTaskScreen();
  else if(ui.openCat && ui.openSub) m.innerHTML = renderPriorities();
  else if(ui.openCat) m.innerHTML = renderGroups();
  else m.innerHTML = renderAreas();
  Array.prototype.forEach.call(document.querySelectorAll("#viewSwitch button"), function(b){
    b.setAttribute("aria-selected", String(b.dataset.view === ui.view));
  });
}

/* ============ one task, opened ============ */
function metaRow(label, value){
  return '<div class="d-row"><span class="d-label">'+esc(label)+'</span><span class="d-value">'+value+'</span></div>';
}

function openDetail(id){
  var t = byId(id);
  if(!t) return;
  var c = cat(t.category), sg = sub(t.category, t.sub), q = quad(t.quadrant), d = dueInfo(t.due);
  var pills = '<div class="status-group" role="group" aria-label="Status">'+
    STATUS_IDS.map(function(sid){
      return '<button data-act="status" data-id="'+t.id+'" data-status="'+sid+'" '+
        'style="--sc:'+q.color+'" aria-pressed="'+(t.status===sid)+'">'+
        statusGlyph(sid)+'<span>'+esc(stat(sid).label)+'</span></button>';
    }).join("")+'</div>';

  var el = $("#taskModal");
  el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Task" style="--accent-row:'+q.color+'">'+
    '<div class="sheet-head">'+
      '<h3 class="d-title'+(t.status==="done"?" done":"")+'">'+esc(t.title)+'</h3>'+
      '<button class="icon-btn x" data-act="close" aria-label="Close">'+ic("x")+'</button></div>'+
    '<div class="d-status">'+pills+'</div>'+
    '<div class="d-meta">'+
      metaRow("Area", '<span class="tag">'+c.icon+' '+esc(c.name)+'</span>'+
                      '<span class="tag">'+sg.icon+' '+esc(sg.name)+'</span>')+
      metaRow("Priority", '<span class="tag" style="--tc:'+q.color+'">'+quadGlyph(q.id)+esc(q.name)+'</span>')+
      metaRow("Due", d ? '<span class="tag '+(d.cls==="overdue"&&t.status!=="done"?"overdue":"")+'">'+
                          ic(d.cls==="overdue"&&t.status!=="done"?"clock":"cal")+
                          (d.days<0 && t.status!=="done" ? "Overdue · " : "")+esc(d.label)+'</span>'
                       : '<span class="d-none">No due date</span>')+
      metaRow("Notes", t.notes ? '<span class="d-notes">'+esc(t.notes)+'</span>'
                               : '<span class="d-none">None</span>')+
    '</div>'+
    '<div class="sheet-foot">'+
      '<button class="btn danger grow" data-act="del" data-id="'+t.id+'">'+ic("trash")+'Delete</button>'+
      '<button class="btn" data-act="edit" data-id="'+t.id+'">'+ic("pencil")+'Edit</button>'+
      '<button class="btn primary" data-act="close">Done</button>'+
    '</div></div>';
  el.hidden = false;
  wiz = null;
}

function cycleStatus(id){
  var t = byId(id); if(!t) return;
  setStatus(id, t.status === "todo" ? "doing" : (t.status === "doing" ? "done" : "todo"));
}

/* ============ new task: one question at a time ============ */
var draft = null, wiz = null;

function openTask(id, prefill){
  prefill = prefill || {};
  var t = id ? byId(id) : null;
  var c = t ? cat(t.category) : cat(prefill.cat || ui.openCat || state.categories[0].id);
  var sid = t ? t.sub : (prefill.sub ? sub(c.id, prefill.sub).id
                       : (ui.openCat === c.id && ui.openSub ? ui.openSub : c.subs[0].id));
  draft = {
    id: t ? t.id : null,
    title: t ? t.title : "",
    category: c.id,
    sub: sid,
    quadrant: t ? t.quadrant : (prefill.quad || ui.tab || "q1"),
    status: t ? t.status : "todo",
    due: t ? t.due : "",
    notes: t ? t.notes : ""
  };
  var steps = ["title"];
  if(t){
    steps = ["title","category","sub","quadrant","more"];
  }else{
    if(!prefill.cat)  steps.push("category");
    if(!prefill.sub)  steps.push("sub");
    if(!prefill.quad) steps.push("quadrant");
    steps.push("more");
  }
  wiz = {steps:steps, i:0, editing:!!t};
  renderWiz();
}

function pickRow(k, val, icon, name, meta, color, advance){
  return '<button type="button" class="row-item" data-act="wiz-pick" data-k="'+k+'" data-val="'+val+'" '+
    (advance ? 'data-advance="1" ' : '')+'style="--accent-row:'+color+'" aria-pressed="'+(draft[k] === val)+'">'+
    '<span class="row-ico">'+icon+'</span>'+
    '<span class="row-txt"><span class="row-name">'+esc(name)+'</span>'+
      (meta ? '<span class="row-meta">'+esc(meta)+'</span>' : '')+'</span>'+
    (draft[k] === val ? '<span class="tick">'+ic("check")+'</span>' : '')+'</button>';
}

function wizStep(){
  var step = wiz.steps[wiz.i], c = cat(draft.category);
  if(step === "title") return {
    q:"What do you need to do?",
    hint:"A few plain words are plenty.",
    body:'<input class="input" id="f_title" placeholder="e.g. Pay the electricity bill" '+
         'value="'+esc(draft.title)+'" autocomplete="off">'
  };
  if(step === "category") return {
    q:"Which area of life?",
    hint:"Tap one to keep going.",
    body:'<div class="wiz-pick">'+ state.categories.map(function(x){
      return pickRow("category", x.id, x.icon, x.name, x.subs.length+" groups", "var(--accent)", true);
    }).join("") +'</div>'
  };
  if(step === "sub") return {
    q:"Which group in "+c.name+"?",
    hint:"Pick the slice it belongs to.",
    body:'<div class="wiz-pick">'+ c.subs.map(function(sg){
      return pickRow("sub", sg.id, sg.icon, sg.name, "", "var(--accent)", true);
    }).join("") +'</div>'
  };
  if(step === "quadrant") return {
    q:"How urgent and important is it?",
    hint:"This decides which box it lands in.",
    body:'<div class="wiz-pick">'+ QUADS.map(function(q){
      return pickRow("quadrant", q.id, quadGlyph(q.id), q.name, q.hint, q.color, true);
    }).join("") +'</div>'
  };
  return {
    q:"Anything else?",
    hint:"All optional — tap "+(wiz.editing ? "Save changes" : "Add task")+" whenever you are ready.",
    body:'<div class="wiz-pick">'+ STATUS_IDS.map(function(sid){
        return pickRow("status", sid, statusGlyph(sid), stat(sid).label, "", "var(--accent)", false);
      }).join("") +'</div>'+
      '<div class="row2" style="margin-top:13px">'+
        '<div class="field"><label for="f_due">Due date</label>'+
          '<input class="input" id="f_due" type="date" value="'+esc(draft.due)+'"></div>'+
        '<div class="field"><label for="f_notes">Notes</label>'+
          '<textarea class="input" id="f_notes" placeholder="Anything worth remembering…">'+esc(draft.notes)+'</textarea></div>'+
      '</div>'
  };
}

function renderWiz(){
  var st = wizStep(), last = wiz.i === wiz.steps.length - 1;
  var dots = wiz.steps.map(function(_,i){ return '<i class="'+(i===wiz.i?"on":"")+'"></i>'; }).join("");
  var el = $("#taskModal");
  el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+(wiz.editing?"Edit task":"New task")+'">'+
      '<div class="wiz-top">'+
        (wiz.i ? '<button class="icon-btn" data-act="wiz-back" aria-label="Back">'+ic("left")+'</button>' : '')+
        '<span class="wiz-name">'+(wiz.editing ? "Edit task" : "New task")+'</span>'+
        '<span class="wiz-dots" aria-label="Step '+(wiz.i+1)+' of '+wiz.steps.length+'">'+dots+'</span>'+
        '<button class="icon-btn" data-act="close" aria-label="Close">'+ic("x")+'</button>'+
      '</div>'+
      '<div class="wiz-body">'+
        '<div class="wiz-q">'+esc(st.q)+'</div>'+
        '<p class="wiz-hint">'+esc(st.hint)+'</p>'+
        st.body+
      '</div>'+
      '<div class="sheet-foot">'+
        (wiz.editing && last ? '<button class="btn danger grow" data-act="del" data-id="'+draft.id+'">'+
          ic("trash")+'Delete</button>' : '')+
        (wiz.i ? '<button class="btn ghost" data-act="wiz-back">'+ic("left")+'Back</button>' : '')+
        '<button class="btn primary" data-act="wiz-next">'+
          (last ? (wiz.editing ? "Save changes" : ic("check")+"Add task") : "Next"+ic("chev"))+'</button>'+
      '</div></div>';
  el.hidden = false;
  if(wiz.steps[wiz.i] === "title"){
    setTimeout(function(){ var i = $("#f_title"); if(i){ i.focus(); i.select(); } }, 40);
  }
}

function captureWiz(){
  if(!wiz) return;
  var t = $("#f_title"); if(t) draft.title = t.value;
  var d = $("#f_due");   if(d) draft.due = d.value;
  var n = $("#f_notes"); if(n) draft.notes = n.value;
}

function wizGo(delta){
  captureWiz();
  if(delta > 0 && wiz.steps[wiz.i] === "title" && !draft.title.trim()){
    toast("Give the task a name first");
    var i = $("#f_title"); if(i) i.focus();
    return;
  }
  var n = wiz.i + delta;
  if(n < 0) return;
  if(n >= wiz.steps.length){ saveTask(); return; }
  wiz.i = n; renderWiz();
}

function saveTask(){
  captureWiz();
  var title = (draft.title || "").trim();
  if(!title){ toast("Give the task a name first"); return; }
  var existing = draft.id ? byId(draft.id) : null;
  var wasDone = existing && existing.status === "done";
  var newId = null;
  if(existing){
    existing.title = title; existing.notes = draft.notes.trim(); existing.due = draft.due;
    existing.category = draft.category; existing.sub = draft.sub;
    existing.quadrant = draft.quadrant; existing.status = draft.status;
    if(draft.status === "done" && !wasDone) existing.done_at = Date.now();
  }else{
    newId = uid("t");
    state.tasks.unshift({id:newId, title:title, notes:draft.notes.trim(), due:draft.due,
      category:draft.category, sub:draft.sub, quadrant:draft.quadrant, status:draft.status,
      created:Date.now(), done_at: draft.status === "done" ? Date.now() : 0});
  }
  save(); closeModals(); render();
  if(draft.status === "done" && !wasDone){
    celebrate(document.querySelector('[data-task="'+(existing ? existing.id : newId)+'"]'));
  }else{
    toast(existing ? "Task updated" : "Task added");
  }
}

/* ============ settings + category editor ============ */
function openSettings(){ ui.setMode = {mode:"settings"}; renderSetModal(); }
function openEditor(catId, from){ ui.setMode = {mode:"editor", cat:catId, from:from||"settings"}; renderSetModal(); }

function settingsPaneHTML(){
  var rows = state.categories.map(function(c){
    var n = tasksIn({cat:c.id}).length;
    return '<div class="set-block">'+
      '<div class="set-row">'+
        '<input class="input emoji" data-set="cat-icon" data-c="'+c.id+'" value="'+esc(c.icon)+'" maxlength="4" aria-label="Area icon">'+
        '<input class="input grow" data-set="cat-name" data-c="'+c.id+'" value="'+esc(c.name)+'" maxlength="28" aria-label="Area name">'+
      '</div>'+
      '<div class="set-row tight">'+
        '<button class="btn sm ghost" data-act="edit-cat" data-cat="'+c.id+'">'+ic("layers")+c.subs.length+' group'+
          (c.subs.length===1?"":"s")+'</button>'+
        '<span class="mini-note">'+n+' task'+(n===1?"":"s")+'</span>'+
        (state.categories.length > 1 ?
          '<button class="btn sm danger" data-act="del-cat" data-cat="'+c.id+'">'+ic("trash")+'Remove</button>' : '')+
      '</div></div>';
  }).join("");
  var srows = STATUS_IDS.map(function(sid){
    return '<div class="set-row">'+
      '<span class="tag" style="--tc:'+STATUS_COLORS[sid]+'">'+statusGlyph(sid)+esc(stat(sid).label)+'</span>'+
      '<input class="input grow" data-set="st-label" data-k="'+sid+'" value="'+esc(stat(sid).label)+
        '" maxlength="24" aria-label="Status label"></div>';
  }).join("");

  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Settings">'+
    '<div class="sheet-head"><h3>Settings</h3>'+
      '<button class="icon-btn x" data-act="close" aria-label="Close">'+ic("x")+'</button></div>'+
    '<p class="note">Rename anything: your areas and the groups inside them, the three status labels, and '+
      'the message shown when a task is finished. Colour always comes from the priority box.</p>'+
    '<div class="sec-title"><span>Your areas ('+state.categories.length+')</span><span class="line"></span></div>'+ rows +
    '<button class="btn add-line" data-act="add-cat">'+ic("plus")+'Add another area</button>'+
    '<div class="sec-title"><span>Status labels</span><span class="line"></span></div>'+ srows +
    '<div class="sec-title"><span>Celebration message</span><span class="line"></span></div>'+
    '<div class="field"><input class="input" data-set="cheer" value="'+esc(state.cheer)+'" maxlength="60" '+
      'placeholder="Great job! Successfully completed 🎉" aria-label="Celebration message"></div>'+
    '<div class="sec-title"><span>Start fresh</span><span class="line"></span></div>'+
    '<div class="rows">'+
      '<button class="row-item danger-row" data-act="clear-tasks">'+
        '<span class="row-ico">'+ic("trash")+'</span>'+
        '<span class="row-txt"><span class="row-name">Clear all tasks</span>'+
        '<span class="row-meta">Deletes your '+state.tasks.length+' task'+(state.tasks.length===1?"":"s")+
          '. Areas, groups and labels stay.</span></span></button>'+
      '<button class="row-item danger-row" data-act="reset">'+
        '<span class="row-ico">'+ic("grid")+'</span>'+
        '<span class="row-txt"><span class="row-name">Reset everything</span>'+
        '<span class="row-meta">Back to four empty areas with the original names.</span></span></button>'+
    '</div>'+
    '<div class="sheet-foot">'+
      '<button class="btn primary" data-act="close">Done</button>'+
    '</div></div>';
}

function editorPaneHTML(){
  var c = cat(ui.setMode.cat);
  var subs = c.subs.map(function(s){
    var n = tasksIn({cat:c.id, sub:s.id}).length;
    return '<div class="set-row">'+
      '<input class="input emoji" data-set="sub-icon" data-c="'+c.id+'" data-s="'+s.id+'" value="'+esc(s.icon)+
        '" maxlength="4" aria-label="Group icon">'+
      '<input class="input grow" data-set="sub-name" data-c="'+c.id+'" data-s="'+s.id+'" value="'+esc(s.name)+
        '" maxlength="28" aria-label="Group name">'+
      '<span class="mini-note">'+n+' task'+(n===1?"":"s")+'</span>'+
      (c.subs.length > 1 ? '<button class="mini del" data-act="del-sub" data-cat="'+c.id+'" data-sub="'+s.id+
        '" title="Remove group" aria-label="Remove group">'+ic("trash")+'</button>' : '')+
    '</div>';
  }).join("");

  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Edit area">'+
    '<div class="sheet-head">'+
      '<button class="icon-btn" data-act="to-settings" title="Back to settings" aria-label="Back">'+ic("left")+'</button>'+
      '<h3>'+esc(c.name)+'</h3>'+
      '<button class="icon-btn x" data-act="close" aria-label="Close">'+ic("x")+'</button></div>'+
    '<div class="sec-title"><span>Name and icon</span><span class="line"></span></div>'+
    '<div class="set-row">'+
      '<input class="input emoji" data-set="cat-icon" data-c="'+c.id+'" value="'+esc(c.icon)+'" maxlength="4" aria-label="Area icon">'+
      '<input class="input grow" data-set="cat-name" data-c="'+c.id+'" value="'+esc(c.name)+'" maxlength="28" aria-label="Area name">'+
    '</div>'+

    '<div class="sec-title"><span>Groups inside '+esc(c.name)+' ('+c.subs.length+')</span><span class="line"></span></div>'+
    subs +
    '<button class="btn add-line" data-act="add-sub" data-cat="'+c.id+'">'+ic("plus")+'Add a group</button>'+
    '<div class="sheet-foot">'+
      (state.categories.length > 1 ?
        '<button class="btn danger grow" data-act="del-cat" data-cat="'+c.id+'">'+ic("trash")+'Remove this area</button>' : '')+
      '<button class="btn primary" data-act="close">Done</button>'+
    '</div></div>';
}

function renderSetModal(keepScroll){
  var el = $("#setModal");
  var old = el.querySelector(".sheet");
  var top = keepScroll && old ? old.scrollTop : 0;
  if(!ui.setMode){ el.hidden = true; el.innerHTML = ""; return; }
  el.innerHTML = ui.setMode.mode === "editor" ? editorPaneHTML() : settingsPaneHTML();
  el.hidden = false;
  var now = el.querySelector(".sheet");
  if(now && top) now.scrollTop = top;
}

function focusSetField(sel){
  setTimeout(function(){
    var i = document.querySelector(sel);
    if(i){ i.focus(); if(i.select) i.select(); i.scrollIntoView({block:"center", behavior:"smooth"}); }
  }, 60);
}

function closeModals(){
  $("#taskModal").hidden = true; $("#taskModal").innerHTML = "";
  ui.setMode = null;
  $("#setModal").hidden = true;  $("#setModal").innerHTML = "";
}

/* ============ celebration + toast ============ */
function toast(msg, action){
  var box = $("#toasts");
  var el = document.createElement("div");
  el.className = "toast" + (action ? " has-action" : "");
  el.appendChild(document.createTextNode(msg));
  if(action){
    var btn = document.createElement("button");
    btn.className = "toast-btn";
    btn.textContent = action.label;
    btn.addEventListener("click", function(){
      action.run();
      if(el.parentNode) el.parentNode.removeChild(el);
    });
    el.appendChild(btn);
  }
  box.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, action ? 7200 : 2600);
}

/* ---- starting fresh, with a way back ---- */
var undoSnap = null;

function clearTasks(){
  var n = state.tasks.length;
  if(!n){ toast("There are no tasks to clear"); return; }
  if(!confirm("Clear all "+n+" task"+(n===1?"":"s")+"? Your areas, groups and labels stay as they are.")) return;
  undoSnap = JSON.stringify(state);
  state.tasks = [];
  save(); closeModals(); render();
  toast("Cleared "+n+" task"+(n===1?"":"s"), {label:"Undo", run:undoLast});
}

function resetEverything(){
  if(!confirm("Start completely over? This clears your tasks and puts the areas, groups and labels back to the beginning.")) return;
  undoSnap = JSON.stringify(state);
  var theme = state.theme;
  state = defaults();
  state.theme = theme; state.tasks = []; state.seeded = true;
  ui.openCat = null; ui.openSub = null; ui.tab = null;
  ui.fCat = "all"; ui.fSub = "all"; ui.fStat = "all"; ui.search = "";
  save(); closeModals(); render();
  toast("Everything is back to the start", {label:"Undo", run:undoLast});
}

function undoLast(){
  if(!undoSnap) return;
  try{ state = JSON.parse(undoSnap); }catch(e){ return; }
  undoSnap = null;
  save(); render();
  toast("Put back");
}

function celebrate(node){
  var x = window.innerWidth/2, y = window.innerHeight - 96;
  if(node){
    var r = node.getBoundingClientRect();
    x = r.left + r.width/2;
    y = Math.max(58, r.top + 8);
    node.classList.add("celebrate");
    setTimeout(function(){ node.classList.remove("celebrate"); }, 820);
  }
  var msg = document.createElement("div");
  msg.className = "cheer";
  msg.innerHTML = ic("check") + '<span></span>';
  msg.lastChild.textContent = state.cheer;
  msg.style.left = Math.min(Math.max(x, 108), window.innerWidth - 108) + "px";
  msg.style.top = y + "px";
  document.body.appendChild(msg);
  setTimeout(function(){ if(msg.parentNode) msg.parentNode.removeChild(msg); }, 2400);
}

function setStatus(id, sid){
  var t = byId(id); if(!t || t.status === sid) return;
  var wasDone = t.status === "done";
  t.status = sid;
  if(sid === "done") t.done_at = Date.now();
  save();
  var el = document.querySelector('[data-task="'+id+'"]');
  if(sid === "done" && !wasDone && el){
    celebrate(el);
    setTimeout(function(){ render(); }, 620);   // let the pop finish before the list re-sorts
  }else{
    render();
  }
}

/* ============ areas & groups ============ */
function addCategory(){
  var i = state.categories.length;
  var c = {id:uid("c"), name:"New area", icon:NEW_ICONS[i % NEW_ICONS.length], color:PALETTE[i % PALETTE.length],
    subs:[1,2,3,4].map(function(n,k){ return {id:uid("s"), name:"Group "+n, icon:SUB_ICONS[k]}; })};
  state.categories.push(c);
  save(); render(); openEditor(c.id, "settings");
  focusSetField('[data-set="cat-name"][data-c="'+c.id+'"]');
}

function addSub(catId){
  var c = cat(catId);
  var s = {id:uid("s"), name:"New group", icon:SUB_ICONS[c.subs.length % SUB_ICONS.length]};
  c.subs.push(s);
  save(); render();
  openEditor(c.id, ui.setMode && ui.setMode.from ? ui.setMode.from : "card");
  focusSetField('[data-set="sub-name"][data-s="'+s.id+'"]');
}

function deleteCategory(catId){
  if(state.categories.length < 2){ toast("Keep at least one area"); return; }
  var c = cat(catId), n = tasksIn({cat:c.id}).length;
  if(!confirm('Remove the area "'+c.name+'"'+(n ? ' and its '+n+' task'+(n===1?"":"s") : "")+'? This cannot be undone.')) return;
  state.categories = state.categories.filter(function(x){ return x.id !== catId; });
  state.tasks = state.tasks.filter(function(t){ return t.category !== catId; });
  if(ui.openCat === catId){ ui.openCat = null; ui.openSub = null; }
  if(ui.fCat === catId){ ui.fCat = "all"; ui.fSub = "all"; }
  save();
  if(ui.setMode && ui.setMode.mode === "editor") openSettings(); else renderSetModal(true);
  render(); toast("Area removed");
}

function deleteSub(catId, subId){
  var c = cat(catId);
  if(c.subs.length < 2){ toast("Every area needs at least one group"); return; }
  var s = sub(catId, subId), n = tasksIn({cat:catId, sub:subId}).length;
  if(!confirm('Remove the group "'+s.name+'"'+(n ? ' and its '+n+' task'+(n===1?"":"s") : "")+'? This cannot be undone.')) return;
  c.subs = c.subs.filter(function(x){ return x.id !== subId; });
  state.tasks = state.tasks.filter(function(t){ return !(t.category === catId && t.sub === subId); });
  if(ui.openSub === subId) ui.openSub = null;
  if(ui.fSub === subId) ui.fSub = "all";
  save(); renderSetModal(true); render(); toast("Group removed");
}

function jumpTop(){ try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){ try{ window.scrollTo(0,0); }catch(e2){} } }

/* ============ events ============ */
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act], [data-view], [data-pick]");
  if(!b) return;

  if(b.dataset.view){
    ui.view = b.dataset.view; ui.openCat = null; ui.openSub = null; ui.tab = null;
    render(); jumpTop();
    return;
  }


  switch(b.dataset.act){
    case "open-cat":
      ui.view = "cats"; ui.openCat = b.dataset.cat; ui.openSub = null; ui.tab = null;
      render(); jumpTop(); break;
    case "open-sub":
      ui.view = "cats"; ui.openCat = b.dataset.cat; ui.openSub = b.dataset.sub; ui.tab = null;
      render(); jumpTop(); break;
    case "home": ui.openCat = null; ui.openSub = null; ui.tab = null; render(); jumpTop(); break;
    case "tab": ui.tab = b.dataset.quad; render(); jumpTop(); break;
    case "wiz-next": wizGo(1); break;
    case "wiz-back": wizGo(-1); break;
    case "wiz-pick":
      captureWiz();
      draft[b.dataset.k] = b.dataset.val;
      if(b.dataset.k === "category") draft.sub = cat(draft.category).subs[0].id;
      if(b.dataset.advance) wizGo(1); else renderWiz();
      break;
    case "toggle-filters": ui.showFilters = !ui.showFilters; render(); break;
    case "open-settings": openSettings(); break;
    case "status": {
      var openId = b.dataset.id;
      setStatus(openId, b.dataset.status);
      if(!$("#taskModal").hidden) setTimeout(function(){ openDetail(openId); }, 30);
      break;
    }
    case "cycle": cycleStatus(b.dataset.id); break;
    case "open-task": openDetail(b.dataset.id); break;
    case "add": openTask(null, {cat:b.dataset.cat, sub:b.dataset.sub, quad:b.dataset.quad}); break;
    case "edit": openTask(b.dataset.id); break;
    case "del": {
      var t = byId(b.dataset.id);
      if(t && confirm('Delete "'+t.title+'"? This cannot be undone.')){
        state.tasks = state.tasks.filter(function(x){ return x.id !== t.id; });
        save(); closeModals(); render(); toast("Task deleted");
      }
      break;
    }
    case "save": saveTask(); break;
    case "close": closeModals(); break;
    case "to-settings": openSettings(); break;
    case "edit-cat": openEditor(b.dataset.cat, "card"); break;
    case "add-cat": addCategory(); break;
    case "add-sub": addSub(b.dataset.cat); break;
    case "del-cat": deleteCategory(b.dataset.cat); break;
    case "del-sub": deleteSub(b.dataset.cat, b.dataset.sub); break;

    case "clear-tasks": clearTasks(); break;
    case "reset": resetEverything(); break;
    case "stat":
      ui.view = "all"; ui.openCat = null; ui.openSub = null; ui.tab = null;
      ui.fStat = b.dataset.val; ui.fCat = "all"; ui.fSub = "all"; ui.search = "";
      render(); jumpTop(); break;
    case "clear-filters":
      ui.fStat = "all"; ui.fCat = "all"; ui.fSub = "all"; ui.search = ""; render(); break;
    case "fcat": ui.fCat = b.dataset.val; ui.fSub = "all"; render(); break;
    case "fsub": ui.fSub = b.dataset.val; render(); break;
  }
});

/* live typing: search box + every renameable label */
document.addEventListener("input", function(ev){
  var el = ev.target;
  if(el.id === "searchInput"){
    ui.search = el.value;
    var pos = el.selectionStart;
    render();
    var again = $("#searchInput");
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    return;
  }
  var key = el.dataset && el.dataset.set;
  if(!key) return;
  if(key === "cat-name"){
    cat(el.dataset.c).name = el.value || "Untitled area";
    var h = document.querySelector("#setModal .sheet-head h3");
    if(h && ui.setMode && ui.setMode.mode === "editor") h.textContent = "Edit “"+cat(el.dataset.c).name+"”";
  }
  else if(key === "cat-icon") cat(el.dataset.c).icon = el.value || "•";
  else if(key === "sub-name") sub(el.dataset.c, el.dataset.s).name = el.value || "Untitled group";
  else if(key === "sub-icon") sub(el.dataset.c, el.dataset.s).icon = el.value || "•";
  else if(key === "st-label") state.statuses[el.dataset.k].label = el.value || "Status";
  else if(key === "st-icon")  state.statuses[el.dataset.k].icon = el.value || "•";
  else if(key === "cheer")    state.cheer = el.value || "Done — nice work.";
  save(); render();
});

/* backdrop click, Esc, and a couple of keyboard shortcuts */
document.addEventListener("mousedown", function(ev){
  if(ev.target.classList && ev.target.classList.contains("overlay")) closeModals();
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape"){ closeModals(); return; }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!typing && (ev.key === "n" || ev.key === "N") && $("#taskModal").hidden){ ev.preventDefault(); openTask(null,{}); }
  if(ev.key === "Enter" && !$("#taskModal").hidden && wiz){
    if(document.activeElement.id === "f_notes" && !(ev.metaKey || ev.ctrlKey)) return;
    ev.preventDefault();
    if(ev.metaKey || ev.ctrlKey) saveTask(); else wizGo(1);
  }
});

$("#addBtn").addEventListener("click", function(){ openTask(null,{}); });
$("#fabBtn").addEventListener("click", function(){ openTask(null,{}); });
$("#settingsBtn").addEventListener("click", function(){ openSettings(); });
$("#themeBtn").addEventListener("click", function(){
  state.theme = state.theme === "dark" ? "light" : "dark"; save(); render();
});

Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"), function(el){
  el.innerHTML = ICON[el.getAttribute("data-icon")] || "";
});
render();
})();
</script>
