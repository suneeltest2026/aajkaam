<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum — Priority Matrix</title>
<style>
/* ============================================================
   Momentum — cool graphite UI
   chrome stays monochrome; colour is reserved for meaning
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#F0F2F5;
  --surface-3:#E7EAEF;
  --border:#E0E4EA;
  --border-2:#CFD5DE;
  --text:#0E1116;
  --text-2:#39424F;
  --muted:#69727F;
  --accent:#171C24;
  --accent-2:#000000;
  --accent-soft:#EDEFF3;
  --on-accent:#FFFFFF;

  --st-todo:#64748B;  --st-doing:#B45309;  --st-done:#15803D;
  --q1:#C62828; --q2:#2457C5; --q3:#B26A00; --q4:#5A6875;

  --shadow-1:0 1px 2px rgba(14,17,22,.05);
  --shadow-2:0 4px 14px -6px rgba(14,17,22,.16), 0 1px 2px rgba(14,17,22,.05);
  --shadow-3:0 20px 44px -20px rgba(14,17,22,.34), 0 2px 8px rgba(14,17,22,.06);

  --r-l:14px; --r-m:11px; --r-s:8px;
  --sans:"IBM Plex Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0D11; --surface:#14171D; --surface-2:#1A1E25; --surface-3:#232830;
    --border:#242A33; --border-2:#333B47;
    --text:#E9ECF1; --text-2:#C2C9D4; --muted:#8A94A2;
    --accent:#E9ECF1; --accent-2:#FFFFFF; --accent-soft:#232830; --on-accent:#0B0D11;
    --st-todo:#94A3B8; --st-doing:#E0A33E; --st-done:#4ADE80;
    --q1:#F87171; --q2:#7EA6FF; --q3:#E8B04B; --q4:#94A3B8;
    --shadow-1:0 1px 2px rgba(0,0,0,.45);
    --shadow-2:0 4px 14px -6px rgba(0,0,0,.6);
    --shadow-3:0 24px 48px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0D11; --surface:#14171D; --surface-2:#1A1E25; --surface-3:#232830;
  --border:#242A33; --border-2:#333B47;
  --text:#E9ECF1; --text-2:#C2C9D4; --muted:#8A94A2;
  --accent:#E9ECF1; --accent-2:#FFFFFF; --accent-soft:#232830; --on-accent:#0B0D11;
  --st-todo:#94A3B8; --st-doing:#E0A33E; --st-done:#4ADE80;
  --q1:#F87171; --q2:#7EA6FF; --q3:#E8B04B; --q4:#94A3B8;
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 4px 14px -6px rgba(0,0,0,.6);
  --shadow-3:0 24px 48px -24px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.5; letter-spacing:-.005em; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0; line-height:1.22; letter-spacing:-.021em; font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; background:none; border:0}
a,label,.chip,.row-item,.mstat,.tag{touch-action:manipulation}
::selection{background:color-mix(in srgb, var(--accent) 26%, transparent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.ic{display:inline-flex; width:1em; height:1em; flex:none}
.ic svg{width:100%; height:100%; display:block}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- frame ---------- */
.shell{max-width:920px; margin:0 auto;
  padding:0 max(20px, env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-right))}
.topbar{
  position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  margin:0 calc(50% - 50vw); padding:calc(11px + env(safe-area-inset-top)) max(20px, calc(50vw - 440px)) 11px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.logo{
  width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none;
  background:var(--text); color:var(--bg);
}
.logo .ic{font-size:17px}
.brand h1{font-size:15px; font-weight:600; letter-spacing:-.015em}
.brand p{font-size:10.5px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:600; margin-top:1px}
.segmented{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:10px; border:1px solid var(--border)}
.segmented button{
  display:flex; align-items:center; gap:7px; padding:7px 13px; border-radius:8px;
  font-size:13px; font-weight:550; color:var(--muted); transition:color .14s, background .14s, box-shadow .14s;
}
.segmented button .ic{font-size:15px; opacity:.85}
.segmented button:hover{color:var(--text)}
.segmented button[aria-selected="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); font-weight:600}
.tools{display:flex; align-items:center; gap:7px}
.icon-btn{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
  color:var(--text-2); display:grid; place-items:center; font-size:16px;
  transition:background .14s, border-color .14s, color .14s;
}
.icon-btn:hover{background:var(--surface-2); color:var(--text); border-color:var(--border-2)}
.foot{text-align:center; color:var(--muted); font-size:12px; margin-top:40px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; font-size:13.5px; font-weight:550;
  padding:9px 14px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text);
  transition:background .14s, border-color .14s, color .14s, box-shadow .14s;
}
.btn .ic{font-size:15px}
.btn:hover{background:var(--surface-2); border-color:var(--border-2)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.btn.primary:hover{background:var(--accent-2); border-color:var(--accent-2)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2); color:var(--text)}
.btn.danger{color:#C92A2A; border-color:color-mix(in srgb,#C92A2A 26%,var(--border)); background:transparent}
.btn.danger:hover{background:color-mix(in srgb,#C92A2A 9%,transparent)}
:root[data-theme="dark"] .btn.danger, :root:not([data-theme="light"]) .btn.danger{color:#F87171}
.btn.sm{padding:7px 11px; font-size:12.5px; border-radius:8px}
.btn[aria-pressed="true"]{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 40%,transparent); color:var(--accent)}
.fab{
  position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:70; display:none; width:52px; height:52px; border-radius:16px;
  background:var(--accent); color:var(--on-accent); font-size:22px; place-items:center; box-shadow:var(--shadow-3);
}

/* ---------- question screens ---------- */
.question{font-size:21px; margin:30px 0 6px; font-weight:600}
.q-sub{color:var(--muted); font-size:13.5px; margin:0 0 20px; max-width:60ch}
.rows{display:flex; flex-direction:column; gap:7px}
.row-item{
  --accent-row:var(--accent);
  display:flex; align-items:center; gap:13px; width:100%; text-align:left; min-height:60px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l); padding:11px 13px;
  transition:border-color .14s, background .14s, box-shadow .14s;
}
.row-item:hover{border-color:var(--border-2); box-shadow:var(--shadow-1)}
.row-ico{
  width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:16px; flex:none;
  background:color-mix(in srgb, var(--accent-row) 11%, transparent);
  color:var(--accent-row);
  border:1px solid color-mix(in srgb, var(--accent-row) 20%, transparent);
}
.row-txt{flex:1; min-width:0}
.row-name{display:block; font-weight:600; font-size:14.5px; letter-spacing:-.012em}
.row-meta{display:block; font-size:12.2px; color:var(--muted); margin-top:2px}
.row-pill{
  font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:6px; white-space:nowrap; flex:none;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--border);
}
.row-pill .num{color:var(--text-2); margin-right:2px}
.chev{color:var(--muted); font-size:16px; flex:none; opacity:.7; transition:transform .14s, opacity .14s}
.row-item:hover .chev{transform:translateX(2px); opacity:1}
.row-item.dashed{background:transparent; border-style:dashed; min-height:52px}
.row-item.dashed .row-ico{background:transparent; color:var(--muted); border-style:dashed}
.row-item.dashed .row-name{font-weight:550; color:var(--text-2); font-size:13.8px}
.row-item.dashed:hover{border-color:var(--border-2); background:var(--surface-2)}
.quiet-link{
  display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12.6px; font-weight:500;
  padding:16px 2px 2px;
}
.quiet-link:hover{color:var(--text)}
.quiet-link .ic{font-size:14px}

/* ---------- breadcrumb + section head ---------- */
.crumb{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:22px 0 0}
.back{
  display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12.8px; font-weight:550;
  padding:5px 9px; border-radius:7px; border:1px solid transparent;
}
.back:hover{color:var(--text); background:var(--surface-2); border-color:var(--border)}
.back .ic{font-size:14px}
.crumb-sep{color:var(--border-2); font-size:12px}
.crumb-now{color:var(--text-2); font-size:12.8px; font-weight:600; padding:5px 2px}
.cat-head{
  --accent-row:var(--accent);
  display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin-top:14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l); padding:14px 15px;
}
.cat-emoji{
  width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-size:17px; flex:none;
  background:color-mix(in srgb,var(--accent-row) 11%,transparent); color:var(--accent-row);
  border:1px solid color-mix(in srgb,var(--accent-row) 20%,transparent);
}
.cat-head h2{font-size:16.5px}
.cat-sub{font-size:12.3px; color:var(--muted); margin-top:3px}
.spacer{margin-left:auto}
.group-title{
  display:flex; align-items:center; gap:12px; margin:26px 0 11px;
  font-size:10.8px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.1em;
}
.group-title .line{flex:1; height:1px; background:var(--border)}
.group-title .num{font-family:var(--mono); font-size:11.5px}

/* ---------- counters, search, chips ---------- */
.mini-stats{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}
.mstat{
  --sc:var(--accent); display:inline-flex; align-items:center; gap:7px; min-height:34px; padding:6px 12px;
  border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--muted);
  font-size:12.6px; font-weight:550; transition:border-color .14s, background .14s, color .14s;
}
.mstat b{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text)}
.mstat .ic{font-size:14px; color:var(--sc)}
.mstat:hover{border-color:var(--border-2); background:var(--surface-2); color:var(--text)}
.mstat[aria-pressed="true"]{
  border-color:color-mix(in srgb,var(--sc) 45%,transparent); background:color-mix(in srgb,var(--sc) 9%,transparent);
  color:color-mix(in srgb,var(--sc) 72%,var(--text));
}
.mstat[aria-pressed="true"] b{color:inherit}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px}
.search{
  flex:1 1 220px; display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border);
  border-radius:9px; padding:8px 12px; color:var(--muted); transition:border-color .14s, box-shadow .14s;
}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.search .ic{font-size:15px}
.search input{border:0; background:transparent; outline:none; width:100%; font-size:13.5px; color:var(--text)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  --c:var(--accent);
  border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 11px; font-size:12.4px;
  font-weight:500; color:var(--muted); display:inline-flex; gap:6px; align-items:center;
  transition:border-color .14s, background .14s, color .14s;
}
.chip:hover{color:var(--text); border-color:var(--border-2)}
.chip[aria-pressed="true"]{
  background:color-mix(in srgb,var(--c) 10%,transparent); border-color:color-mix(in srgb,var(--c) 42%,transparent);
  color:color-mix(in srgb,var(--c) 74%,var(--text)); font-weight:600;
}
.sub-chips .chip{font-size:12px}

/* ---------- task rows: one line each ---------- */
.list{display:flex; flex-direction:column; gap:6px}
.task{
  --accent-row:var(--accent);
  position:relative; display:flex; align-items:stretch; overflow:hidden;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-m);
  transition:border-color .14s, box-shadow .14s, opacity .2s;
}
.task::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent-row); opacity:.9}
.task:hover{border-color:var(--border-2); box-shadow:var(--shadow-1)}
.task.done{opacity:.6}
.t-status{
  --sc:var(--st-todo);
  display:grid; place-items:center; width:46px; flex:none; color:var(--sc); font-size:19px;
  border-right:1px solid transparent; transition:background .14s;
}
.t-status:hover{background:color-mix(in srgb,var(--sc) 12%,transparent)}
.t-open{
  flex:1; min-width:0; display:flex; align-items:center; gap:9px; padding:13px 12px 13px 2px;
  text-align:left; color:inherit;
}
.t-title{
  flex:1; min-width:0; font-size:14.6px; font-weight:550; letter-spacing:-.012em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.task.done .t-title{text-decoration:line-through;
  text-decoration-color:color-mix(in srgb,var(--st-done) 60%,transparent); color:var(--muted)}
.t-when{
  flex:none; font-size:11.4px; font-weight:600; padding:3px 8px; border-radius:6px; white-space:nowrap;
  background:color-mix(in srgb,var(--tw) 10%,transparent); color:color-mix(in srgb,var(--tw) 78%,var(--text));
  border:1px solid color-mix(in srgb,var(--tw) 24%,transparent);
}
.t-when.overdue{--tw:var(--q1)}
.t-when.soon{--tw:var(--q3)}
.t-open .chev{width:16px; height:16px; color:var(--muted); opacity:.6; flex:none}
.t-open:hover .chev{opacity:1}
.tag{
  --tc:var(--muted);
  font-size:11.6px; font-weight:550; padding:4px 9px; border-radius:6px; display:inline-flex; gap:5px;
  align-items:center; white-space:nowrap; border:1px solid color-mix(in srgb,var(--tc) 22%,var(--border));
  background:color-mix(in srgb,var(--tc) 8%,transparent); color:color-mix(in srgb,var(--tc) 72%,var(--text));
}
.tag .ic{font-size:12.5px}
.tag.overdue{--tc:var(--q1)}
.status-group{display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px}
.status-group button{
  --sc:var(--st-todo);
  display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 12px; border-radius:7px;
  font-size:12.4px; font-weight:550; color:var(--muted); white-space:nowrap;
  transition:background .14s, color .14s, box-shadow .14s;
}
.status-group button .ic{font-size:14px}
.status-group button:hover{color:var(--text); background:color-mix(in srgb,var(--sc) 10%,transparent)}
.status-group button[aria-pressed="true"]{
  background:var(--surface); color:color-mix(in srgb,var(--sc) 74%,var(--text)); box-shadow:var(--shadow-1); font-weight:600;
}
.status-group button[aria-pressed="true"] .ic{color:var(--sc)}
.mini{
  width:30px; height:30px; border-radius:8px; border:1px solid transparent; color:var(--muted);
  display:grid; place-items:center; font-size:14.5px; transition:background .14s, color .14s, border-color .14s;
}
.mini:hover{background:var(--surface-2); border-color:var(--border); color:var(--text)}
.mini.del:hover{color:#C92A2A; border-color:color-mix(in srgb,#C92A2A 30%,transparent)}

/* ---------- one task, opened ---------- */
.d-title{font-size:18px; line-height:1.3; letter-spacing:-.02em; flex:1; min-width:0; word-break:break-word}
.d-title.done{text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--st-done) 60%,transparent);
  color:var(--muted)}
.d-status{margin-bottom:16px}
.d-status .status-group{width:100%}
.d-status .status-group button{flex:1}
.d-meta{border-top:1px solid var(--border)}
.d-row{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border)}
.d-label{
  width:74px; flex:none; font-size:10.8px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); padding-top:4px;
}
.d-value{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.d-notes{font-size:13.4px; color:var(--text-2); white-space:pre-wrap; word-break:break-word}
.d-none{font-size:13px; color:var(--muted)}

/* ---------- empty ---------- */
.empty{
  text-align:center; padding:42px 20px; border:1px dashed var(--border-2); border-radius:var(--r-l);
  background:var(--surface); color:var(--muted);
}
.empty .e-ico{display:inline-grid; place-items:center; width:40px; height:40px; border-radius:11px;
  background:var(--surface-2); color:var(--muted); font-size:19px; margin-bottom:11px}
.empty h3{color:var(--text); font-size:15px; margin-bottom:5px}
.empty p{margin:0 0 15px; font-size:13px}

/* ---------- sheets ---------- */
.overlay{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:16px;
  background:color-mix(in srgb,#0A0C10 58%, transparent); backdrop-filter:blur(3px);
  animation:fade .14s ease both;
}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(520px,100%); max-height:88vh; overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; box-shadow:var(--shadow-3); padding:18px; animation:rise .18s cubic-bezier(.22,.7,.3,1) both;
}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.sheet-head h3{font-size:15.5px}
.sheet-head .x{margin-left:auto}
.field{margin-bottom:12px}
.field label{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:6px;
  letter-spacing:.08em; text-transform:uppercase}
.input, textarea.input{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2);
  outline:none; font-size:14px; transition:border-color .14s, box-shadow .14s, background .14s;
}
.input:focus{border-color:var(--accent); background:var(--surface);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
textarea.input{resize:vertical; min-height:68px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.sheet-foot{display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap}
.sheet-foot .grow{margin-right:auto}
.note{font-size:12.4px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; margin-bottom:16px}
.sec-title{display:flex; align-items:center; gap:11px; margin:20px 0 10px;
  font-size:10.8px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.sec-title .line{flex:1; height:1px; background:var(--border)}
.set-block{--accent-row:var(--accent); border:1px solid var(--border); border-radius:var(--r-m);
  padding:11px 12px 5px; margin-bottom:9px; background:var(--surface-2)}
.set-block::before{content:""; display:block; width:22px; height:3px; border-radius:2px;
  background:var(--accent-row); margin-bottom:9px}
.set-row{display:flex; gap:8px; align-items:center; margin-bottom:9px; flex-wrap:wrap}
.set-row.tight{gap:6px}
.set-row .emoji{width:46px; text-align:center; padding:10px 4px}
.set-row .grow{flex:1 1 130px}
.mini-note{font-size:11.6px; color:var(--muted); font-family:var(--mono)}
.btn.add-line{width:100%; justify-content:center; border-style:dashed; color:var(--muted)}
.btn.add-line:hover{color:var(--text)}

/* ---------- wizard ---------- */
.wiz-top{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.wiz-name{font-weight:600; font-size:13px; color:var(--muted); letter-spacing:.02em}
.wiz-dots{display:flex; gap:4px; margin-left:auto}
.wiz-dots i{width:16px; height:3px; border-radius:2px; background:var(--surface-3); transition:background .18s}
.wiz-dots i.on{background:var(--accent)}
.wiz-q{font-size:17.5px; font-weight:600; letter-spacing:-.018em; margin-bottom:4px}
.wiz-hint{color:var(--muted); font-size:12.8px; margin-bottom:15px}
.wiz-body{animation:fade .16s ease both}
.wiz-body .input{font-size:15.5px; padding:12px 13px}
.wiz-pick{display:flex; flex-direction:column; gap:6px}
.wiz-pick .row-item{min-height:52px; padding:9px 11px}
.wiz-pick .row-item[aria-pressed="true"]{
  border-color:color-mix(in srgb,var(--accent-row) 50%,transparent);
  background:color-mix(in srgb,var(--accent-row) 7%,transparent);
}
.wiz-pick .row-ico{width:32px; height:32px; font-size:15px; border-radius:9px}
.tick{color:var(--accent-row); font-size:15px; display:inline-flex}

/* ---------- completion toast ---------- */
.cheer{
  position:fixed; z-index:300; transform:translate(-50%,-100%);
  display:flex; align-items:center; gap:9px; max-width:88vw; white-space:nowrap; pointer-events:none;
  background:var(--text); color:var(--bg); font-size:13px; font-weight:550;
  padding:9px 14px; border-radius:10px; box-shadow:var(--shadow-3);
  animation:cheer-in .22s cubic-bezier(.22,.9,.3,1) both, cheer-out .4s ease 1.9s both;
}
.cheer .ic{font-size:15px; color:var(--bg)}
@keyframes cheer-in{from{opacity:0; transform:translate(-50%,-88%)}to{opacity:1; transform:translate(-50%,-100%)}}
@keyframes cheer-out{to{opacity:0; transform:translate(-50%,-112%)}}
.task.celebrate{animation:done-flash .8s ease}
@keyframes done-flash{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st-done) 45%,transparent)}
  40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--st-done) 22%,transparent)}
  100%{box-shadow:0 0 0 0 transparent}
}
.toasts{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:300; display:flex;
  flex-direction:column; gap:7px; align-items:center; pointer-events:none}
.toast{
  background:var(--text); color:var(--bg); font-size:12.8px; font-weight:550; padding:9px 14px; border-radius:9px;
  box-shadow:var(--shadow-3); animation:fade .16s ease both, cheer-out .4s ease 2.2s both;
}

.toasts{pointer-events:none}
.toast.has-action{display:flex; align-items:center; gap:12px; padding:8px 8px 8px 14px; pointer-events:auto}
.toast-btn{
  font-size:12.6px; font-weight:600; color:var(--bg); padding:5px 11px; border-radius:7px;
  border:1px solid color-mix(in srgb, var(--bg) 40%, transparent); background:transparent; transition:background .14s;
}
.toast-btn:hover{background:color-mix(in srgb, var(--bg) 18%, transparent)}
.row-item.danger-row .row-ico{color:var(--q1); background:color-mix(in srgb,var(--q1) 9%,transparent);
  border-color:color-mix(in srgb,var(--q1) 22%,transparent)}
.row-item.danger-row:hover{border-color:color-mix(in srgb,var(--q1) 45%,transparent);
  background:color-mix(in srgb,var(--q1) 4%,transparent)}
.row-item.danger-row .row-name{color:var(--q1)}

/* ---------- phones ---------- */
@media (max-width:760px){
  .shell{padding:0 max(14px, env(safe-area-inset-left)) calc(104px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right))}
  .topbar{margin:0 calc(50% - 50vw); padding:calc(9px + env(safe-area-inset-top)) 14px 9px; gap:9px}
  .brand p{display:none}
  .segmented{order:3; width:100%; padding:3px}
  .segmented button{flex:1; justify-content:center; min-height:42px}
  .tools .btn.primary{display:none}
  .fab{display:grid}
  .question{font-size:19px; margin-top:22px}
  .row-item{min-height:58px}
  .t-status{width:52px; font-size:20px}
  .t-open{padding:14px 12px 14px 2px}
  .row2{grid-template-columns:1fr}
  .sheet{padding:16px; border-radius:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

/* ---------- priority home ---------- */
.prio-block{--accent-row:var(--accent); display:block; margin-bottom:26px}
.prio-head{display:flex; align-items:center; gap:11px; margin:0 0 10px}
.prio-ico{
  width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:16px; flex:none;
  background:color-mix(in srgb,var(--accent-row) 12%,transparent); color:var(--accent-row);
  border:1px solid color-mix(in srgb,var(--accent-row) 24%,transparent);
}
.prio-txt{min-width:0}
.prio-name{display:block; font-size:13.6px; font-weight:600; letter-spacing:-.01em}
.prio-hint{display:block; font-size:11.6px; color:var(--muted); margin-top:1px}
.prio-hint b{color:var(--q1); font-weight:600}
.prio-head .line{flex:1; height:1px; background:var(--border)}
.prio-count{
  font-size:12px; font-weight:600; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--border); border-radius:6px; padding:2px 8px; flex:none;
}
.prio-block .list{gap:7px}
.prio-block .row-item.dashed{min-height:52px}
@media (max-width:760px){
  .prio-block{margin-bottom:22px}
  .prio-name{font-size:13.2px}
}
</style>
