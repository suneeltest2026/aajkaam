<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum — Eisenhower To-Do</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f4f6fc; --blob-a:#c7d2fe; --blob-b:#fbcfe8; --blob-c:#bbf7d0;
  --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
  --text:#101426; --text-2:#3d4356; --muted:#767f96; --border:#e6e9f2;
  --shadow-s:0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.06);
  --shadow-m:0 6px 22px -8px rgba(16,24,40,.18);
  --shadow-l:0 26px 60px -20px rgba(16,24,40,.35);
  --brand:#6d5efc; --brand-2:#ec4899;
  --r-xl:24px; --r-l:18px; --r-m:14px; --r-s:10px;
}
html[data-theme="dark"]{
  --bg:#0d0f16; --blob-a:#2a2f6b; --blob-b:#5c1f45; --blob-c:#123a2e;
  --surface:#161a24; --surface-2:#1c2130; --surface-3:#232937;
  --text:#eef1f8; --text-2:#c4cad9; --muted:#8f98ad; --border:#2a3040;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 8px 24px -8px rgba(0,0,0,.6);
  --shadow-l:0 26px 60px -20px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:-20vh -10vw auto -10vw; height:80vh; z-index:-1; pointer-events:none;
  background:
    radial-gradient(38vw 38vw at 12% 8%, var(--blob-a) 0%, transparent 62%),
    radial-gradient(34vw 34vw at 88% 0%, var(--blob-b) 0%, transparent 60%),
    radial-gradient(30vw 30vw at 60% 40%, var(--blob-c) 0%, transparent 62%);
  opacity:.55; filter:blur(10px);
}
h1,h2,h3,h4{margin:0; letter-spacing:-.02em; line-height:1.2}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
::selection{background:color-mix(in srgb, var(--brand) 30%, transparent)}
:focus-visible{outline:2.5px solid var(--brand); outline-offset:2px; border-radius:8px}

/* ---------- layout ---------- */
.shell{max-width:1180px; margin:0 auto; padding:22px 20px 80px}
.topbar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:var(--r-xl);
  padding:12px 14px; box-shadow:var(--shadow-m); position:sticky; top:14px; z-index:60;
}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.logo{
  width:42px; height:42px; border-radius:13px; display:grid; place-items:center; font-size:20px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
  box-shadow:0 8px 18px -6px color-mix(in srgb, var(--brand) 70%, transparent);
  transform:rotate(-4deg);
}
.brand h1{font-size:19px}
.brand p{margin:1px 0 0; font-size:11.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:600}
.segmented{display:flex; gap:4px; background:var(--surface-3); padding:4px; border-radius:999px; border:1px solid var(--border)}
.segmented button{
  border:0; background:transparent; color:var(--text-2); font-weight:650; font-size:13.5px;
  padding:8px 15px; border-radius:999px; display:flex; align-items:center; gap:7px;
  transition:background .18s ease, color .18s ease, transform .18s ease;
}
.segmented button:hover{color:var(--text); transform:translateY(-1px)}
.segmented button[aria-selected="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow-s)}
.tools{display:flex; align-items:center; gap:8px}
.icon-btn{
  width:40px; height:40px; border-radius:13px; border:1px solid var(--border); background:var(--surface);
  font-size:17px; display:grid; place-items:center; transition:transform .16s ease, box-shadow .16s ease, background .16s;
}
.icon-btn:hover{transform:translateY(-2px) rotate(-6deg); box-shadow:var(--shadow-m)}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:650;
  padding:10px 16px; border-radius:13px; display:inline-flex; align-items:center; gap:8px; font-size:14px;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s;
}
.btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-m)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.primary{
  border-color:transparent; color:#fff; background:linear-gradient(135deg,var(--brand),#8b5cf6);
  box-shadow:0 10px 22px -10px color-mix(in srgb, var(--brand) 85%, transparent);
}
.btn.ghost{background:transparent}
.btn.danger{color:#ef4444; border-color:color-mix(in srgb,#ef4444 35%,transparent); background:color-mix(in srgb,#ef4444 8%,transparent)}
.btn.sm{padding:7px 12px; font-size:13px; border-radius:11px}

/* ---------- hero / stats ---------- */
.hero{margin:26px 2px 18px; display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap}
.hero h2{font-size:clamp(24px,3.6vw,33px)}
.hero h2 .wave{display:inline-block; animation:wave 2.6s ease-in-out infinite; transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(16deg)}80%{transform:rotate(-8deg)}90%{transform:rotate(12deg)}}
.hero p{margin:7px 0 0; color:var(--muted); font-size:14.5px; max-width:56ch}
.stats{display:flex; gap:10px; flex-wrap:wrap}
.stat{
  --sc:var(--brand);
  position:relative; text-align:left; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-l); padding:11px 15px; min-width:104px; box-shadow:var(--shadow-s);
  transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s, background .18s;
}
.stat:hover{transform:translateY(-3px); box-shadow:var(--shadow-m);
  border-color:color-mix(in srgb,var(--sc) 45%,var(--border))}
.stat:active{transform:translateY(-1px) scale(.985)}
.stat[aria-pressed="true"]{border-color:color-mix(in srgb,var(--sc) 60%,transparent);
  background:color-mix(in srgb,var(--sc) 10%,var(--surface));
  box-shadow:0 10px 24px -14px color-mix(in srgb,var(--sc) 95%,transparent)}
.stat b{display:block; font-size:22px; letter-spacing:-.03em}
.stat span{display:block; font-size:11.5px; color:var(--muted); font-weight:650; letter-spacing:.05em; text-transform:uppercase}
.stat .peek{position:absolute; top:9px; right:11px; font-size:11px; color:var(--muted); opacity:0; transition:opacity .18s, transform .18s}
.stat:hover .peek{opacity:1; transform:translateX(2px)}
@media (hover:none){ .stat .peek{opacity:.45} }

/* ---------- category cards ---------- */
.grid-cats{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:16px}
.cat-card{
  --accent:var(--brand);
  position:relative; overflow:hidden; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); padding:18px;
  box-shadow:var(--shadow-s); transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, border-color .22s;
}
.cat-card::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(70% 90% at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
}
.cat-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-l); border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.cat-card:hover .cat-emoji{transform:scale(1.12) rotate(-8deg)}
.cat-top{display:flex; align-items:center; gap:12px}
.cat-emoji{
  width:50px; height:50px; border-radius:16px; display:grid; place-items:center; font-size:24px; flex:none;
  background:color-mix(in srgb, var(--accent) 15%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  transition:transform .25s cubic-bezier(.2,.8,.3,1);
}
.cat-top>span:last-child{display:block; min-width:0}
.cat-name{display:block; font-size:18.5px; font-weight:750; letter-spacing:-.02em}
.cat-sub{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px}
.bar{height:9px; border-radius:99px; background:var(--surface-3); display:flex; overflow:hidden; margin:15px 0 10px}
.bar i{display:block; transition:width .5s cubic-bezier(.2,.8,.3,1)}
.quad-mini{display:flex; gap:6px; flex-wrap:wrap}
.qchip{
  font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:99px; display:inline-flex; gap:5px; align-items:center;
  background:color-mix(in srgb, var(--qc) 14%, transparent); color:color-mix(in srgb, var(--qc) 78%, var(--text));
  border:1px solid color-mix(in srgb, var(--qc) 26%, transparent);
}
.cat-foot{display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:13px; color:var(--muted); font-weight:650}
.cat-card .go{color:color-mix(in srgb,var(--accent) 80%, var(--text)); transition:transform .2s}
.cat-card:hover .go{transform:translateX(4px)}

/* ---------- category detail ---------- */
.crumb{display:flex; align-items:center; gap:10px; margin:24px 2px 14px; flex-wrap:wrap}
.back{
  border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:8px 15px 8px 12px;
  font-weight:650; font-size:13.5px; display:inline-flex; align-items:center; gap:8px; box-shadow:var(--shadow-s);
  transition:transform .16s, box-shadow .16s;
}
.back:hover{transform:translateX(-3px); box-shadow:var(--shadow-m)}
.cat-head{
  --accent:var(--brand);
  display:flex; align-items:center; gap:15px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); padding:16px 18px;
  box-shadow:var(--shadow-s); position:relative; overflow:hidden;
}
.cat-head::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(100deg, color-mix(in srgb,var(--accent) 13%,transparent), transparent 55%)}
.cat-head .cat-emoji{width:56px; height:56px; font-size:27px}
.cat-head h2{font-size:24px}
.cat-head .cat-sub{margin-top:3px}
.cat-head .spacer{margin-left:auto}
.tabs{display:flex; gap:9px; overflow-x:auto; padding:16px 2px 4px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  --qc:var(--brand);
  flex:1 1 190px; min-width:172px; text-align:left; border:1px solid var(--border); background:var(--surface);
  border-radius:var(--r-l); padding:12px 14px; box-shadow:var(--shadow-s);
  transition:transform .18s, box-shadow .18s, border-color .18s, background .18s;
}
.tab:hover{transform:translateY(-3px); box-shadow:var(--shadow-m)}
.tab[aria-selected="true"]{
  border-color:color-mix(in srgb,var(--qc) 55%,transparent);
  background:color-mix(in srgb,var(--qc) 10%, var(--surface));
  box-shadow:0 10px 24px -12px color-mix(in srgb,var(--qc) 90%,transparent);
}
.tab .t-row{display:flex; align-items:center; gap:9px}
.tab .t-ico{width:30px; height:30px; border-radius:10px; display:grid; place-items:center; font-size:15px; flex:none;
  background:color-mix(in srgb,var(--qc) 16%,transparent)}
.tab .t-name{font-weight:720; font-size:13.6px; letter-spacing:-.01em}
.tab .t-meta{display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:11.5px; color:var(--muted); font-weight:650}
.tab .count{background:color-mix(in srgb,var(--qc) 18%,transparent); color:color-mix(in srgb,var(--qc) 80%,var(--text));
  padding:2px 9px; border-radius:99px; font-weight:750}

/* ---------- filters ---------- */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:20px 2px 14px}
.search{
  flex:1 1 240px; display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border);
  border-radius:13px; padding:9px 13px; box-shadow:var(--shadow-s);
}
.search input{border:0; background:transparent; outline:none; width:100%; font-size:14px}
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{
  border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:7px 13px; font-size:13px;
  font-weight:650; color:var(--text-2); display:inline-flex; gap:6px; align-items:center; transition:.16s;
}
.chip:hover{transform:translateY(-1px); box-shadow:var(--shadow-s)}
.chip[aria-pressed="true"]{--c:var(--brand); background:color-mix(in srgb,var(--c) 14%,transparent);
  border-color:color-mix(in srgb,var(--c) 45%,transparent); color:color-mix(in srgb,var(--c) 75%,var(--text))}

/* ---------- task list ---------- */
.list{display:flex; flex-direction:column; gap:11px}
.group-title{display:flex; align-items:center; gap:9px; margin:22px 2px 10px; font-size:13px; font-weight:750;
  color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.group-title .line{flex:1; height:1px; background:var(--border)}
.task{
  --accent:var(--brand);
  position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l);
  padding:14px 15px 13px 18px; box-shadow:var(--shadow-s); display:flex; gap:14px; align-items:flex-start;
  transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s, opacity .3s;
  animation:pop-in .32s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes pop-in{from{opacity:0; transform:translateY(8px) scale(.985)}to{opacity:1; transform:none}}
.task::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:4px; border-radius:99px; background:var(--accent)}
.task:hover{transform:translateY(-3px); box-shadow:var(--shadow-m); border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.task.done .t-title{text-decoration:line-through; text-decoration-thickness:2px;
  text-decoration-color:color-mix(in srgb,#10b981 70%,transparent); color:var(--muted)}
.task.done{opacity:.82}
.t-body{flex:1; min-width:0}
.t-title{font-weight:700; font-size:15.4px; letter-spacing:-.01em; word-break:break-word}
.t-notes{margin:5px 0 0; font-size:13.2px; color:var(--muted); white-space:pre-wrap; word-break:break-word}
.tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.tag{
  font-size:11.4px; font-weight:700; padding:3.5px 9px; border-radius:99px; display:inline-flex; gap:5px; align-items:center;
  background:color-mix(in srgb, var(--tc) 13%, transparent); color:color-mix(in srgb, var(--tc) 80%, var(--text));
  border:1px solid color-mix(in srgb, var(--tc) 25%, transparent); white-space:nowrap;
}
.tag.due-soon{--tc:#f97316}
.tag.overdue{--tc:#ef4444; animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:translateX(-2px)}96%{transform:translateX(2px)}}
.t-right{display:flex; flex-direction:column; align-items:flex-end; gap:9px}
.status-group{display:flex; gap:3px; background:var(--surface-3); border:1px solid var(--border); border-radius:999px; padding:3px}
.status-group button{
  border:0; background:transparent; border-radius:999px; padding:6px 11px; font-size:12.4px; font-weight:700;
  color:var(--muted); display:inline-flex; align-items:center; gap:5px; transition:.18s; white-space:nowrap;
}
.status-group button:hover{color:var(--text); background:color-mix(in srgb,var(--sc) 14%,transparent)}
.status-group button[aria-pressed="true"]{
  background:color-mix(in srgb,var(--sc) 18%,var(--surface)); color:color-mix(in srgb,var(--sc) 82%,var(--text));
  box-shadow:var(--shadow-s); transform:scale(1.02);
}
.t-actions{display:flex; gap:5px; opacity:.5; transition:opacity .18s}
.task:hover .t-actions, .task:focus-within .t-actions{opacity:1}
.mini{width:30px; height:30px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
  display:grid; place-items:center; font-size:13.5px; transition:.16s}
.mini:hover{transform:translateY(-2px); box-shadow:var(--shadow-s)}
.mini.del:hover{background:color-mix(in srgb,#ef4444 12%,transparent); border-color:color-mix(in srgb,#ef4444 40%,transparent)}

/* ---------- empty ---------- */
.empty{
  text-align:center; padding:46px 20px; border:2px dashed var(--border); border-radius:var(--r-xl);
  background:color-mix(in srgb,var(--surface) 60%, transparent); color:var(--muted);
}
.empty .e-ico{font-size:38px; display:block; margin-bottom:8px; animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.empty h3{color:var(--text); font-size:17px; margin-bottom:5px}
.empty p{margin:0 0 14px; font-size:13.6px}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:18px;
  background:color-mix(in srgb,#0b1020 55%, transparent); backdrop-filter:blur(6px);
  animation:fade .2s ease both;
}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(560px,100%); max-height:88vh; overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-xl); box-shadow:var(--shadow-l); padding:20px; animation:rise .3s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes rise{from{opacity:0; transform:translateY(18px) scale(.97)}to{opacity:1; transform:none}}
.sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.sheet-head h3{font-size:19px}
.sheet-head .x{margin-left:auto}
.field{margin-bottom:13px}
.field label{display:block; font-size:12.4px; font-weight:700; color:var(--muted); margin-bottom:6px; letter-spacing:.03em}
.input, textarea.input, select.input{
  width:100%; padding:11px 13px; border-radius:13px; border:1px solid var(--border); background:var(--surface-2);
  outline:none; font-size:14.4px; transition:border-color .16s, box-shadow .16s, background .16s;
}
.input:focus{border-color:var(--brand); background:var(--surface); box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
textarea.input{resize:vertical; min-height:74px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.picker{display:grid; gap:8px}
.picker.cats{grid-template-columns:repeat(2,1fr)}
.opt{
  --oc:var(--brand); text-align:left; border:1.5px solid var(--border); background:var(--surface-2); border-radius:13px;
  padding:10px 12px; display:flex; align-items:center; gap:9px; font-weight:650; font-size:13.4px; transition:.16s;
}
.opt:hover{transform:translateY(-2px); box-shadow:var(--shadow-s)}
.opt .o-ico{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; flex:none; font-size:15px;
  background:color-mix(in srgb,var(--oc) 16%,transparent)}
.opt small{display:block; font-weight:600; font-size:11.4px; color:var(--muted)}
.opt[aria-pressed="true"]{border-color:color-mix(in srgb,var(--oc) 65%,transparent);
  background:color-mix(in srgb,var(--oc) 11%,var(--surface)); box-shadow:0 8px 20px -12px color-mix(in srgb,var(--oc) 90%,transparent)}
.sheet-foot{display:flex; gap:9px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap}
.sheet-foot .grow{margin-right:auto}
.set-row{display:flex; gap:9px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
.set-row .emoji{width:52px; text-align:center; padding:11px 4px}
.set-row .grow{flex:1 1 130px}
.swatches{display:flex; gap:5px}
.sw{width:22px; height:22px; border-radius:8px; border:2px solid transparent; transition:.15s; padding:0}
.sw:hover{transform:scale(1.18)}
.sw[aria-pressed="true"]{border-color:var(--text); transform:scale(1.14)}
.note{font-size:12.6px; color:var(--muted); background:var(--surface-2); border:1px dashed var(--border);
  border-radius:12px; padding:10px 12px; margin:4px 0 16px}
.sec-title{font-size:12.4px; font-weight:750; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  margin:20px 0 10px; display:flex; align-items:center; gap:8px}
.sec-title .line{flex:1; height:1px; background:var(--border)}

/* ---------- celebration ---------- */
.cheer{
  position:fixed; z-index:300; transform:translate(-50%,-100%);
  background:linear-gradient(135deg,#10b981,#22c55e); color:#fff; font-weight:750; font-size:13.8px;
  padding:10px 16px; border-radius:999px; box-shadow:0 16px 34px -12px rgba(16,185,129,.8);
  display:flex; align-items:center; gap:8px; pointer-events:none; white-space:nowrap; max-width:88vw;
  animation:cheer-in .42s cubic-bezier(.2,1.4,.4,1) both, cheer-out .5s ease 1.7s both;
}
@keyframes cheer-in{from{opacity:0; transform:translate(-50%,-70%) scale(.7)}to{opacity:1; transform:translate(-50%,-100%) scale(1)}}
@keyframes cheer-out{to{opacity:0; transform:translate(-50%,-135%) scale(.94)}}
.confetti{position:fixed; z-index:299; width:9px; height:9px; border-radius:2px; pointer-events:none;
  animation:burst var(--d) cubic-bezier(.15,.7,.4,1) forwards}
@keyframes burst{
  0%{opacity:1; transform:translate(-50%,-50%) rotate(0) scale(1)}
  100%{opacity:0; transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(.5)}
}
.task.celebrate{animation:cel-pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cel-pop{0%{transform:scale(1)}45%{transform:scale(1.022)}100%{transform:scale(1)}}

/* ---------- toast (plain) ---------- */
.toasts{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:300; display:flex;
  flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{background:var(--text); color:var(--bg); font-weight:650; font-size:13.4px; padding:10px 16px; border-radius:999px;
  box-shadow:var(--shadow-l); animation:cheer-in .3s ease both, cheer-out .45s ease 2.1s both; display:flex; gap:8px; align-items:center}

/* ---------- fab + misc ---------- */
.fab{position:fixed; right:18px; bottom:18px; z-index:70; display:none; width:58px; height:58px; border-radius:20px;
  border:0; color:#fff; font-size:26px; background:linear-gradient(135deg,var(--brand),#8b5cf6);
  box-shadow:0 18px 34px -12px color-mix(in srgb,var(--brand) 90%,transparent);}
.foot{text-align:center; color:var(--muted); font-size:12.4px; margin-top:38px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (max-width:780px){
  .shell{padding:14px 13px 96px}
  .topbar{top:8px; padding:10px; gap:10px; border-radius:20px}
  .brand p{display:none}
  .segmented{order:3; width:100%}
  .segmented button{flex:1; justify-content:center}
  .tools .btn.primary{display:none}
  .fab{display:grid; place-items:center}
  .task{flex-direction:column; gap:11px; padding:14px 14px 13px 16px}
  .t-right{flex-direction:column; align-items:stretch; width:100%; gap:8px}
  .status-group{width:100%}
  .status-group button{flex:1; justify-content:center; padding:8px 4px; font-size:11.6px; gap:4px}
  .t-actions{opacity:1; justify-content:flex-start}
  .mini{width:34px; height:34px}
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; overflow:visible; padding:14px 0 4px}
  .tab{min-width:0; padding:11px 12px}
  .tab .t-name{font-size:12.6px}
  .tab .t-meta{font-size:10.8px}
  .row2{grid-template-columns:1fr}
  .picker.cats{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
  .picker.cats .opt{padding:9px 10px; font-size:13px; gap:8px}
  .picker.cats .opt span:last-child{min-width:0; word-break:break-word}
  .hero{margin-top:20px}
  .stat{flex:1 1 calc(50% - 10px); min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

/* ---------- hierarchy: card wrappers, add-cards, breadcrumbs ---------- */
.card-wrap{position:relative; display:flex}
.card-wrap>.cat-card{width:100%}
.card-edit{
  position:absolute; top:12px; right:12px; z-index:2; width:30px; height:30px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); font-size:13px; display:grid; place-items:center;
  opacity:0; transform:translateY(-3px); transition:opacity .18s, transform .18s, box-shadow .18s;
}
.card-wrap:hover .card-edit, .card-edit:focus-visible{opacity:1; transform:none; box-shadow:var(--shadow-s)}
@media (hover:none){ .card-edit{opacity:.7; transform:none} }
.qchip b{font-weight:800}
.add-card{
  border:2px dashed var(--border); background:color-mix(in srgb,var(--surface) 55%, transparent);
  border-radius:var(--r-xl); padding:18px; min-height:132px; display:flex; align-items:center; gap:13px;
  text-align:left; color:var(--muted); transition:.2s;
}
.add-card:hover{border-color:color-mix(in srgb,var(--brand) 55%,transparent); color:var(--text);
  background:color-mix(in srgb,var(--brand) 7%,transparent); transform:translateY(-3px)}
.add-card .plus{
  width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-size:23px; flex:none;
  background:color-mix(in srgb,var(--brand) 14%,transparent); color:var(--brand);
}
.add-card b{display:block; font-size:15.5px; color:var(--text); letter-spacing:-.01em}
.add-card small{display:block; font-size:12.4px; margin-top:2px}
.crumb-sep{color:var(--muted); font-weight:700}
.crumb-now{color:var(--muted); font-size:13.5px; font-weight:650}
.back.plain{padding:8px 14px}
.back.plain:hover{transform:translateY(-2px)}
.sub-chips{padding-left:2px}
.sub-chips .chip{font-size:12.4px}

/* ---------- settings blocks ---------- */
.set-block{
  --accent:var(--brand);
  border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--r-m);
  padding:11px 12px 4px; margin-bottom:11px; background:var(--surface-2);
}
.set-row.tight{gap:7px; margin-bottom:8px}
.mini-note{font-size:12px; color:var(--muted); font-weight:650}
.btn.add-line{width:100%; justify-content:center; border-style:dashed; color:var(--text-2); margin-bottom:4px}
.btn.add-line:hover{color:var(--text); border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.swatches.wide{display:flex; flex-wrap:wrap; gap:6px}
.sheet-head h3{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo">◆</div>
      <div>
        <h1>Momentum</h1>
        <p>Priority matrix</p>
      </div>
    </div>
    <nav class="segmented" id="viewSwitch" role="tablist" aria-label="Choose a view">
      <button role="tab" data-view="cats" aria-selected="true">🗂️ By Category</button>
      <button role="tab" data-view="all" aria-selected="false">📋 All Activities</button>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" title="Light / dark mode" aria-label="Toggle dark mode">🌙</button>
      <button class="icon-btn" id="settingsBtn" title="Rename categories, statuses & message" aria-label="Settings">⚙️</button>
      <button class="btn primary" id="addBtn">＋ New task</button>
    </div>
  </header>
  <main id="main"></main>
  <p class="foot">Everything is saved automatically in this browser — no account, no internet needed.</p>
</div>
<button class="fab" id="fabBtn" aria-label="Add a new task">＋</button>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="taskModal" hidden></div>
<div class="overlay" id="setModal" hidden></div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
var KEY = "momentum.eisenhower.v2";
var OLD_KEY = "momentum.eisenhower.v1";
var PALETTE = ["#6366f1","#ec4899","#10b981","#f59e0b","#0ea5e9","#8b5cf6","#ef4444","#14b8a6"];
var NEW_ICONS = ["✨","🎯","🧭","🎨","🏡","🌱","🛠️","📚"];
var SUB_ICONS = ["📌","🗂️","📎","⭐"];

var QUADS = [
  {id:"q1", name:"Important & Urgent",          hint:"Do it now",        icon:"🔥", color:"#ef4444"},
  {id:"q2", name:"Important but Not Urgent",    hint:"Schedule it",      icon:"🗓️", color:"#6366f1"},
  {id:"q3", name:"Not Important but Urgent",    hint:"Do quick / share", icon:"⚡", color:"#f59e0b"},
  {id:"q4", name:"Not Important and Not Urgent",hint:"Whenever",         icon:"🌿", color:"#14b8a6"}
];
var STATUS_IDS = ["todo","doing","done"];
var STATUS_COLORS = {todo:"#94a3b8", doing:"#f59e0b", done:"#10b981"};

function defaults(){
  return {
    categories:[
      {id:"c1", name:"Work", icon:"💼", color:"#6366f1", subs:[
        {id:"c1s1",name:"Projects",icon:"📁"},{id:"c1s2",name:"Meetings",icon:"🗣️"},
        {id:"c1s3",name:"Admin",icon:"🗃️"},{id:"c1s4",name:"Growth",icon:"📈"}]},
      {id:"c2", name:"Personal", icon:"🌈", color:"#ec4899", subs:[
        {id:"c2s1",name:"Home",icon:"🏠"},{id:"c2s2",name:"Family",icon:"👨‍👩‍👧"},
        {id:"c2s3",name:"Friends",icon:"🎉"},{id:"c2s4",name:"Fun",icon:"🎮"}]},
      {id:"c3", name:"Health", icon:"💪", color:"#10b981", subs:[
        {id:"c3s1",name:"Fitness",icon:"🏃"},{id:"c3s2",name:"Food",icon:"🥗"},
        {id:"c3s3",name:"Rest",icon:"😴"},{id:"c3s4",name:"Appointments",icon:"🩺"}]},
      {id:"c4", name:"Finance", icon:"💰", color:"#f59e0b", subs:[
        {id:"c4s1",name:"Bills",icon:"🧾"},{id:"c4s2",name:"Savings",icon:"🏦"},
        {id:"c4s3",name:"Budget",icon:"📊"},{id:"c4s4",name:"Investing",icon:"📈"}]}
    ],
    statuses:{
      todo:{label:"Not Started", icon:"⚪"},
      doing:{label:"In Process", icon:"🚀"},
      done:{label:"Finished",    icon:"✅"}
    },
    cheer:"Great job! Successfully completed 🎉",
    theme:"light",
    tasks:[],
    seeded:false
  };
}

function seedTasks(){
  var t = Date.now();
  var s = [
    ["Send the quarterly report","c1","c1s1","q1","doing","Almost done — just needs the summary page."],
    ["Plan next month's team goals","c1","c1s4","q2","todo",""],
    ["Reply to newsletter sign-ups","c1","c1s3","q3","todo",""],
    ["Book dentist appointment","c3","c3s4","q1","todo",""],
    ["Weekend trip ideas","c2","c2s4","q4","todo","Somewhere with a lake 🏞️"],
    ["30-minute walk after lunch","c3","c3s1","q2","done",""],
    ["Pay the electricity bill","c4","c4s1","q1","todo",""],
    ["Review savings plan","c4","c4s2","q2","todo",""]
  ];
  return s.map(function(x,i){
    return {id:"t"+(t+i), title:x[0], category:x[1], sub:x[2], quadrant:x[3], status:x[4],
            notes:x[5], due:"", created:t+i, done_at:(x[4]==="done"? t : 0)};
  });
}

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ============ state ============ */
var state = load();
var ui = {view:"cats", openCat:null, openSub:null, tab:"q1",
          search:"", fCat:"all", fSub:"all", fStat:"all", setMode:null};

function load(){
  var base = defaults(), raw = null, migrated = false;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw){
    try{ raw = localStorage.getItem(OLD_KEY); migrated = !!raw; }catch(e){}
  }
  try{
    var s = raw ? JSON.parse(raw) : null;
    if(s && typeof s === "object"){
      if(Array.isArray(s.categories) && s.categories.length){
        base.categories = s.categories.map(function(c,i){
          var proto = defaults().categories[i % 4];
          var subs = Array.isArray(c.subs) && c.subs.length ? c.subs : proto.subs.map(function(x,j){
            return {id:(c.id||"c")+"s"+(j+1), name:x.name, icon:x.icon};
          });
          return {id:c.id||uid("c"), name:c.name||proto.name, icon:c.icon||proto.icon,
                  color:c.color||proto.color, subs:subs};
        });
      }
      if(typeof s.cheer === "string" && s.cheer.trim()) base.cheer = s.cheer;
      base.theme = s.theme === "dark" ? "dark" : "light";
      base.tasks = Array.isArray(s.tasks) ? s.tasks : [];
      base.seeded = !!s.seeded;
      STATUS_IDS.forEach(function(k){
        if(s.statuses && s.statuses[k]){
          if(s.statuses[k].label) base.statuses[k].label = s.statuses[k].label;
          if(s.statuses[k].icon)  base.statuses[k].icon  = s.statuses[k].icon;
        }
      });
    }
  }catch(e){ base = defaults(); }

  if(!base.seeded){ base.tasks = seedTasks(); base.seeded = true; }

  /* every task must point at a category + sub that still exists */
  base.tasks = base.tasks.filter(function(t){ return t && t.title; }).map(function(t){
    var c = null, i;
    for(i=0;i<base.categories.length;i++) if(base.categories[i].id === t.category) c = base.categories[i];
    if(!c) c = base.categories[0];
    var has = false;
    for(i=0;i<c.subs.length;i++) if(c.subs[i].id === t.sub) has = true;
    t.category = c.id;
    if(!has) t.sub = c.subs[0].id;
    return t;
  });
  if(migrated){ try{ localStorage.setItem(KEY, JSON.stringify(base)); }catch(e){} }
  return base;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("⚠️ Could not save — browser storage is full or blocked."); }
}

/* ============ small helpers ============ */
function $(sel,root){ return (root||document).querySelector(sel); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function cat(id){
  for(var i=0;i<state.categories.length;i++) if(state.categories[i].id===id) return state.categories[i];
  return state.categories[0];
}
function catIndex(id){
  for(var i=0;i<state.categories.length;i++) if(state.categories[i].id===id) return i;
  return -1;
}
function sub(catId, subId){
  var c = cat(catId);
  for(var i=0;i<c.subs.length;i++) if(c.subs[i].id===subId) return c.subs[i];
  return c.subs[0];
}
function quad(id){ for(var i=0;i<QUADS.length;i++) if(QUADS[i].id===id) return QUADS[i]; return QUADS[0]; }
function stat(id){ return state.statuses[id] || state.statuses.todo; }
function tasksIn(f){
  f = f || {};
  return state.tasks.filter(function(t){
    return (!f.cat || t.category===f.cat) && (!f.sub || t.sub===f.sub) && (!f.quad || t.quadrant===f.quad);
  });
}
function byId(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null; }
function todayISO(){
  var d = new Date(); d.setHours(0,0,0,0);
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function dueInfo(iso){
  if(!iso) return null;
  var t = todayISO();
  var a = new Date(iso+"T00:00:00"), b = new Date(t+"T00:00:00");
  var days = Math.round((a-b)/86400000);
  var label = a.toLocaleDateString(undefined,{month:"short", day:"numeric"});
  if(days === 0) label = "Today";
  else if(days === 1) label = "Tomorrow";
  else if(days === -1) label = "Yesterday";
  return {days:days, label:label, cls: days<0 ? "overdue" : (days<=2 ? "due-soon" : "")};
}
function pct(n,d){ return d ? Math.round(n*100/d) : 0; }
function countsOf(list){
  var done=0, doing=0;
  list.forEach(function(t){ if(t.status==="done") done++; else if(t.status==="doing") doing++; });
  return {all:list.length, done:done, doing:doing, todo:list.length-done-doing};
}
function barHTML(c){
  if(!c.all) return "";
  return '<i style="width:'+pct(c.done,c.all)+'%;background:'+STATUS_COLORS.done+'"></i>'+
         '<i style="width:'+pct(c.doing,c.all)+'%;background:'+STATUS_COLORS.doing+'"></i>'+
         '<i style="width:'+pct(c.todo,c.all)+'%;background:'+STATUS_COLORS.todo+'"></i>';
}

/* ============ shared pieces ============ */
function statusGroupHTML(t){
  var out = '<div class="status-group" role="group" aria-label="Status">';
  STATUS_IDS.forEach(function(sid){
    var s = stat(sid);
    out += '<button data-act="status" data-id="'+t.id+'" data-status="'+sid+'" '+
           'style="--sc:'+STATUS_COLORS[sid]+'" aria-pressed="'+(t.status===sid)+'" '+
           'title="'+esc(s.label)+'">'+s.icon+'<span class="lbl">'+esc(s.label)+'</span></button>';
  });
  return out + '</div>';
}

function taskHTML(t, opts){
  opts = opts || {};
  var c = cat(t.category), sc = sub(t.category, t.sub), q = quad(t.quadrant), s = stat(t.status);
  var d = dueInfo(t.due);
  var tags = "";
  if(opts.tags === "full"){
    tags += '<span class="tag" style="--tc:'+c.color+'">'+c.icon+" "+esc(c.name)+'</span>';
    tags += '<span class="tag" style="--tc:'+c.color+'">'+sc.icon+" "+esc(sc.name)+'</span>';
    tags += '<span class="tag" style="--tc:'+q.color+'">'+q.icon+" "+esc(q.name)+'</span>';
  }else if(opts.tags === "sub"){
    tags += '<span class="tag" style="--tc:'+c.color+'">'+sc.icon+" "+esc(sc.name)+'</span>';
  }
  tags += '<span class="tag" style="--tc:'+STATUS_COLORS[t.status]+'">'+s.icon+" "+esc(s.label)+'</span>';
  if(d) tags += '<span class="tag '+d.cls+'" style="--tc:'+(d.cls?"":"#64748b")+'">📅 '+
                 (d.days<0 && t.status!=="done" ? "Overdue · " : "")+esc(d.label)+'</span>';

  return '<article class="task'+(t.status==="done"?" done":"")+'" data-task="'+t.id+'" style="--accent:'+c.color+'">'+
    '<div class="t-body">'+
      '<div class="t-title">'+esc(t.title)+'</div>'+
      (t.notes ? '<p class="t-notes">'+esc(t.notes)+'</p>' : '')+
      '<div class="tags">'+tags+'</div>'+
    '</div>'+
    '<div class="t-right">'+ statusGroupHTML(t) +
      '<div class="t-actions">'+
        '<button class="mini" data-act="edit" data-id="'+t.id+'" title="Edit task" aria-label="Edit task">✏️</button>'+
        '<button class="mini del" data-act="del" data-id="'+t.id+'" title="Delete task" aria-label="Delete task">🗑️</button>'+
      '</div>'+
    '</div>'+
  '</article>';
}

function listHTML(items, opts, empty){
  if(!items.length) return empty;
  var order = {todo:0, doing:1, done:2};
  items = items.slice().sort(function(a,b){
    if(order[a.status] !== order[b.status]) return order[a.status]-order[b.status];
    if(!!a.due !== !!b.due) return a.due ? -1 : 1;
    if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    return b.created - a.created;
  });
  return '<div class="list">' + items.map(function(t){ return taskHTML(t,opts); }).join("") + '</div>';
}

function emptyHTML(icon, title, text, btn){
  return '<div class="empty"><span class="e-ico">'+icon+'</span><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+
    (btn ? '<button class="btn primary" data-act="add" '+(btn.cat?'data-cat="'+btn.cat+'" ':'')+
           (btn.sub?'data-sub="'+btn.sub+'" ':'')+(btn.quad?'data-quad="'+btn.quad+'" ':'')+
           '>＋ '+esc(btn.label)+'</button>' : '')+'</div>';
}

function statsHTML(){
  var all = state.tasks, c = countsOf(all), today = todayISO();
  var late = all.filter(function(t){ return t.status!=="done" && t.due && t.due < today; }).length;
  var tiles = [
    {val:"all",     n:c.all,   label:"Total",             color:"var(--brand)",      num:""},
    {val:"doing",   n:c.doing, label:stat("doing").label, color:STATUS_COLORS.doing, num:STATUS_COLORS.doing},
    {val:"done",    n:c.done,  label:stat("done").label,  color:STATUS_COLORS.done,  num:STATUS_COLORS.done},
    {val:"overdue", n:late,    label:"Overdue",           color:"#ef4444",           num:late?"#ef4444":""}
  ];
  return '<div class="stats">'+ tiles.map(function(x){
    var on = ui.view === "all" && ui.fStat === x.val;
    return '<button class="stat" data-act="stat" data-val="'+x.val+'" style="--sc:'+x.color+'" '+
      'aria-pressed="'+on+'" title="Show these tasks in a list">'+
      '<span class="peek">'+(on?"●":"→")+'</span>'+
      '<b'+(x.num?' style="color:'+x.num+'"':'')+'>'+x.n+'</b><span>'+esc(x.label)+'</span></button>';
  }).join("") + '</div>';
}

function greeting(){
  var h = new Date().getHours();
  return h<12 ? "Good morning" : (h<18 ? "Good afternoon" : "Good evening");
}

function crumbHTML(parts){
  return '<div class="crumb">'+ parts.map(function(p,i){
    if(p.act) return '<button class="back'+(i?" plain":"")+'" data-act="'+p.act+'"'+
      (p.cat?' data-cat="'+p.cat+'"':'')+'>'+(i?"":"← ")+esc(p.label)+'</button>';
    return '<span class="crumb-now">'+esc(p.label)+'</span>';
  }).join('<span class="crumb-sep">/</span>') + '</div>';
}

/* ============ dashboard: main categories ============ */
function renderDashboard(){
  var cards = state.categories.map(function(c){
    var counts = countsOf(tasksIn({cat:c.id}));
    var chips = c.subs.map(function(s){
      var open = tasksIn({cat:c.id, sub:s.id}).filter(function(t){return t.status!=="done";}).length;
      return '<span class="qchip" style="--qc:'+c.color+'">'+s.icon+" "+esc(s.name)+
             (open?' <b>'+open+'</b>':'')+'</span>';
    }).join("");
    return '<div class="card-wrap">'+
      '<button class="cat-card" data-act="open-cat" data-cat="'+c.id+'" style="--accent:'+c.color+'">'+
        '<div class="cat-top"><span class="cat-emoji">'+c.icon+'</span>'+
          '<span><span class="cat-name">'+esc(c.name)+'</span>'+
          '<span class="cat-sub">'+c.subs.length+' group'+(c.subs.length===1?"":"s")+' · '+
            counts.all+' task'+(counts.all===1?"":"s")+
            (counts.done ? ' · '+counts.done+' '+esc(stat("done").label.toLowerCase()) : '')+
            '</span></span></div>'+
        '<div class="bar">'+barHTML(counts)+'</div>'+
        '<div class="quad-mini">'+chips+'</div>'+
        '<div class="cat-foot"><span>Open groups &amp; priority tabs</span><span class="go">→</span></div>'+
      '</button>'+

/* ============ all activities ============ */
function filterSummary(n){
  var what = ui.fStat === "all" ? "task" :
             (ui.fStat === "overdue" ? "overdue task" : stat(ui.fStat).label.toLowerCase()+" task");
  var where = ui.fCat === "all" ? "" : " in "+cat(ui.fCat).name +
              (ui.fSub === "all" ? "" : " › "+sub(ui.fCat, ui.fSub).name);
  if(ui.fStat === "all" && ui.fCat === "all" && !ui.search.trim()) return "Showing all "+n+" task"+(n===1?"":"s");
  return "Showing "+n+" "+what+(n===1?"":"s")+where+" of "+state.tasks.length+" total";
}

function renderAll(){
  var term = ui.search.trim().toLowerCase();
  var items = state.tasks.filter(function(t){
    if(ui.fCat !== "all" && t.category !== ui.fCat) return false;
    if(ui.fCat !== "all" && ui.fSub !== "all" && t.sub !== ui.fSub) return false;
    if(ui.fStat === "overdue"){ if(t.status === "done" || !t.due || t.due >= todayISO()) return false; }
    else if(ui.fStat !== "all" && t.status !== ui.fStat) return false;
    if(term && (t.title+" "+(t.notes||"")).toLowerCase().indexOf(term) === -1) return false;
    return true;
  });
  var catChips = '<button class="chip" data-act="fcat" data-val="all" aria-pressed="'+(ui.fCat==="all")+'">All areas</button>'+
    state.categories.map(function(c){
      return '<button class="chip" data-act="fcat" data-val="'+c.id+'" style="--c:'+c.color+'" aria-pressed="'+
        (ui.fCat===c.id)+'">'+c.icon+' '+esc(c.name)+'</button>';
    }).join("");
  var subChips = "";
  if(ui.fCat !== "all"){
    var c = cat(ui.fCat);
    subChips = '<div class="toolbar" style="margin-top:-4px"><div class="chips sub-chips">'+
      '<button class="chip" data-act="fsub" data-val="all" style="--c:'+c.color+'" aria-pressed="'+
        (ui.fSub==="all")+'">All of '+esc(c.name)+'</button>'+
      c.subs.map(function(s){
        return '<button class="chip" data-act="fsub" data-val="'+s.id+'" style="--c:'+c.color+'" aria-pressed="'+
          (ui.fSub===s.id)+'">'+s.icon+' '+esc(s.name)+'</button>';
      }).join("")+'</div></div>';
  }
  var statChips = '<button class="chip" data-act="fstat" data-val="all" aria-pressed="'+(ui.fStat==="all")+'">Any status</button>'+
    STATUS_IDS.map(function(sid){
      return '<button class="chip" data-act="fstat" data-val="'+sid+'" style="--c:'+STATUS_COLORS[sid]+'" aria-pressed="'+
        (ui.fStat===sid)+'">'+stat(sid).icon+' '+esc(stat(sid).label)+'</button>';
    }).join("")+
    '<button class="chip" data-act="fstat" data-val="overdue" style="--c:#ef4444" aria-pressed="'+
      (ui.fStat==="overdue")+'">⏰ Overdue</button>';

  return '<section class="hero"><div><h2>All activities 📋</h2>'+
      '<p>Every task from every area, group and priority tab, in one master list. '+
      'Tags show exactly where each one lives.</p></div>'+ statsHTML() +'</section>'+
    '<div class="toolbar">'+
      '<label class="search">🔎<input id="searchInput" type="search" placeholder="Search tasks and notes…" value="'+
        esc(ui.search)+'" aria-label="Search tasks"></label>'+
      '<button class="btn primary" data-act="add">＋ New task</button>'+
    '</div>'+
    '<div class="toolbar" style="margin-top:0"><div class="chips">'+catChips+'</div></div>'+
    subChips+
    '<div class="toolbar" style="margin-top:-4px"><div class="chips">'+statChips+'</div></div>'+
    '<div class="group-title"><span>'+esc(filterSummary(items.length))+'</span><span class="line"></span>'+
      (ui.fStat!=="all" || ui.fCat!=="all" || ui.search.trim() ?
        '<button class="btn sm ghost" data-act="clear-filters">✕ Clear filters</button>' : '')+'</div>'+
    listHTML(items, {tags:"full"}, emptyHTML(ui.fStat==="overdue" ? "🎈" : "🗒️",
      ui.fStat==="overdue" ? "Nothing is overdue" : "No tasks match",
      state.tasks.length ? (ui.fStat==="overdue" ? "You are on top of every due date. Nice."
                                                 : "Try clearing the filters or the search box.")
                         : "Add your first task to get the ball rolling.",
      {label:"Add a task"}));
}

function render(){
  document.documentElement.setAttribute("data-theme", state.theme);
  $("#themeBtn").textContent = state.theme === "dark" ? "☀️" : "🌙";
  var m = $("#main");
  if(ui.view === "all") m.innerHTML = renderAll();
  else if(ui.openCat && ui.openSub) m.innerHTML = renderSub();
  else if(ui.openCat) m.innerHTML = renderCategory();
  else m.innerHTML = renderDashboard();
  Array.prototype.forEach.call(document.querySelectorAll("#viewSwitch button"), function(b){
    b.setAttribute("aria-selected", String(b.dataset.view === ui.view));
  });
}

/* ============ task modal ============ */
var draft = null;

function openTask(id, prefill){
  var t = id ? byId(id) : null;
  var c;
  if(t) c = cat(t.category);
  else c = cat((prefill && prefill.cat) || ui.openCat || state.categories[0].id);
  var sid;
  if(t) sid = t.sub;
  else if(prefill && prefill.sub) sid = sub(c.id, prefill.sub).id;
  else if(ui.openCat === c.id && ui.openSub) sid = ui.openSub;
  else sid = c.subs[0].id;

  draft = {id: t ? t.id : null, category:c.id, sub:sid,
           quadrant: t ? t.quadrant : ((prefill && prefill.quad) || (ui.openSub ? ui.tab : "q1")),
           status: t ? t.status : "todo"};
  var el = $("#taskModal");
  el.innerHTML = taskSheetHTML(t);
  el.hidden = false;
  syncPickers();
  setTimeout(function(){ var i = $("#f_title"); if(i){ i.focus(); i.select(); } }, 40);
}

function subPickerHTML(){
  var c = cat(draft.category);
  return c.subs.map(function(s){
    return '<button type="button" class="opt" data-pick="sub" data-val="'+s.id+'" style="--oc:'+c.color+'">'+
      '<span class="o-ico">'+s.icon+'</span><span>'+esc(s.name)+'</span></button>';
  }).join("");
}

function taskSheetHTML(t){
  var catOpts = state.categories.map(function(c){
    return '<button type="button" class="opt" data-pick="category" data-val="'+c.id+'" style="--oc:'+c.color+'">'+
      '<span class="o-ico">'+c.icon+'</span><span>'+esc(c.name)+'</span></button>';
  }).join("");
  var quadOpts = QUADS.map(function(q){
    return '<button type="button" class="opt" data-pick="quadrant" data-val="'+q.id+'" style="--oc:'+q.color+'">'+
      '<span class="o-ico">'+q.icon+'</span><span>'+esc(q.name)+'<small>'+esc(q.hint)+'</small></span></button>';
  }).join("");
  var statOpts = STATUS_IDS.map(function(sid){
    return '<button type="button" class="opt" data-pick="status" data-val="'+sid+'" style="--oc:'+STATUS_COLORS[sid]+'">'+
      '<span class="o-ico">'+stat(sid).icon+'</span><span>'+esc(stat(sid).label)+'</span></button>';
  }).join("");

  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+(t?"Edit task":"New task")+'">'+
    '<div class="sheet-head"><h3>'+(t?"✏️ Edit task":"✨ New task")+'</h3>'+
      '<button class="icon-btn x" data-act="close" aria-label="Close">✕</button></div>'+
    '<div class="field"><label for="f_title">What do you need to do?</label>'+
      '<input class="input" id="f_title" placeholder="e.g. Pay the electricity bill" value="'+esc(t?t.title:"")+'"></div>'+
    '<div class="field"><label>1 · Which area of life?</label><div class="picker cats">'+catOpts+'</div></div>'+
    '<div class="field"><label>2 · Which group inside it?</label>'+
      '<div class="picker cats" id="subPicker">'+subPickerHTML()+'</div></div>'+
    '<div class="field"><label>3 · How urgent &amp; important is it?</label><div class="picker">'+quadOpts+'</div></div>'+
    '<div class="field"><label>Status</label><div class="picker cats">'+statOpts+'</div></div>'+
    '<div class="row2">'+
      '<div class="field"><label for="f_due">Due date (optional)</label>'+
        '<input class="input" id="f_due" type="date" value="'+esc(t?t.due:"")+'"></div>'+
      '<div class="field"><label for="f_notes">Notes (optional)</label>'+
        '<textarea class="input" id="f_notes" placeholder="Anything worth remembering…">'+esc(t?t.notes:"")+'</textarea></div>'+
    '</div>'+
    '<div class="sheet-foot">'+
      (t ? '<button class="btn danger grow" data-act="del" data-id="'+t.id+'">🗑️ Delete</button>' : '')+
      '<button class="btn ghost" data-act="close">Cancel</button>'+
      '<button class="btn primary" data-act="save">'+(t?"Save changes":"Add task")+'</button>'+
    '</div></div>';
}

function syncPickers(){
  Array.prototype.forEach.call(document.querySelectorAll("#taskModal .opt"), function(b){
    b.setAttribute("aria-pressed", String(draft[b.dataset.pick] === b.dataset.val));
  });
}

function saveTask(){
  var title = $("#f_title").value.trim();
  if(!title){ $("#f_title").focus(); toast("Give the task a name first ✏️"); return; }
  var due = $("#f_due").value, notes = $("#f_notes").value.trim();
  var existing = draft.id ? byId(draft.id) : null;
  var wasDone = existing && existing.status === "done";
  var newId = null;
  if(existing){
    existing.title = title; existing.notes = notes; existing.due = due;
    existing.category = draft.category; existing.sub = draft.sub;
    existing.quadrant = draft.quadrant; existing.status = draft.status;
    if(draft.status === "done" && !wasDone) existing.done_at = Date.now();
  }else{
    newId = uid("t");
    state.tasks.unshift({id:newId, title:title, notes:notes, due:due, category:draft.category, sub:draft.sub,
      quadrant:draft.quadrant, status:draft.status, created:Date.now(),
      done_at: draft.status === "done" ? Date.now() : 0});
  }
  save(); closeModals(); render();
  if(draft.status === "done" && !wasDone){
    celebrate(document.querySelector('[data-task="'+(existing ? existing.id : newId)+'"]'));
  }else{
    toast(existing ? "Task updated ✅" : "Task added 🎯");
  }
}

function renderSetModal(keepScroll){
  var el = $("#setModal");
  var old = el.querySelector(".sheet");

  el.innerHTML = ui.setMode.mode === "editor" ? editorPaneHTML() : settingsPaneHTML();
  el.hidden = false;
  var now = el.querySelector(".sheet");
  if(now && top) now.scrollTop = top;
}

function focusSetField(sel){
  setTimeout(function(){
    var i = document.querySelector(sel);
    if(i){ i.focus(); if(i.select) i.select(); i.scrollIntoView({block:"center", behavior:"smooth"}); }
  }, 60);
}

function closeModals(){
  $("#taskModal").hidden = true; $("#taskModal").innerHTML = "";
  ui.setMode = null;
  $("#setModal").hidden = true;  $("#setModal").innerHTML = "";
}

/* ============ celebration + toast ============ */
function toast(msg){
  var box = $("#toasts");
  var el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2600);
}

function celebrate(node){
  var x = window.innerWidth/2, y = window.innerHeight - 90;
  if(node){
    var r = node.getBoundingClientRect();
    x = r.left + r.width/2;
    y = Math.max(64, r.top + 12);
    node.classList.add("celebrate");
    setTimeout(function(){ node.classList.remove("celebrate"); }, 520);
  }
  var msg = document.createElement("div");
  msg.className = "cheer";
  msg.textContent = state.cheer;
  msg.style.left = Math.min(Math.max(x, 110), window.innerWidth - 110) + "px";
  msg.style.top = y + "px";
  document.body.appendChild(msg);
  setTimeout(function(){ if(msg.parentNode) msg.parentNode.removeChild(msg); }, 2300);

  var colors = ["#10b981","#22c55e","#6366f1","#f59e0b","#ec4899","#38bdf8"];
  for(var i=0;i<18;i++){
    var p = document.createElement("i");
    p.className = "confetti";
    var ang = Math.PI * (0.12 + 0.76*(i/17));
    var dist = 60 + Math.random()*90;
    p.style.left = x + "px"; p.style.top = y + "px";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--x", (Math.cos(ang)*dist*(Math.random()<.5?-1:1)).toFixed(0)+"px");
    p.style.setProperty("--y", (-Math.sin(ang)*dist - Math.random()*40).toFixed(0)+"px");
    p.style.setProperty("--r", (Math.random()*720-360).toFixed(0)+"deg");
    p.style.setProperty("--d", (600 + Math.random()*450).toFixed(0)+"ms");
    if(i % 3 === 0) p.style.borderRadius = "50%";
    document.body.appendChild(p);
    (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 1200); })(p);
  }
}

function setStatus(id, sid){
  var t = byId(id); if(!t || t.status === sid) return;
  var wasDone = t.status === "done";
  t.status = sid;
  if(sid === "done") t.done_at = Date.now();
  save();
  var el = document.querySelector('[data-task="'+id+'"]');
  if(sid === "done" && !wasDone && el){
    celebrate(el);
    setTimeout(function(){ render(); }, 620);   // let the pop finish before the list re-sorts
  }else{
    render();
  }
}

/* ============ areas & groups ============ */
function addCategory(){
  var i = state.categories.length;
  var c = {id:uid("c"), name:"New area", icon:NEW_ICONS[i % NEW_ICONS.length], color:PALETTE[i % PALETTE.length],
    subs:[1,2,3,4].map(function(n,k){ return {id:uid("s"), name:"Group "+n, icon:SUB_ICONS[k]}; })};
  state.categories.push(c);
  save(); render(); openEditor(c.id, "settings");
  focusSetField('[data-set="cat-name"][data-c="'+c.id+'"]');
}

function addSub(catId){
  var c = cat(catId);
  var s = {id:uid("s"), name:"New group", icon:SUB_ICONS[c.subs.length % SUB_ICONS.length]};
  c.subs.push(s);
  save(); render();
  openEditor(c.id, ui.setMode && ui.setMode.from ? ui.setMode.from : "card");
  focusSetField('[data-set="sub-name"][data-s="'+s.id+'"]');
}

function deleteCategory(catId){
  if(state.categories.length < 2){ toast("Keep at least one area 🙂"); return; }
  var c = cat(catId), n = tasksIn({cat:c.id}).length;
  if(!confirm('Remove the area "'+c.name+'"'+(n ? ' and its '+n+' task'+(n===1?"":"s") : "")+'? This cannot be undone.')) return;
  state.categories = state.categories.filter(function(x){ return x.id !== catId; });
  state.tasks = state.tasks.filter(function(t){ return t.category !== catId; });
  if(ui.openCat === catId){ ui.openCat = null; ui.openSub = null; }
  if(ui.fCat === catId){ ui.fCat = "all"; ui.fSub = "all"; }
  save();
  if(ui.setMode && ui.setMode.mode === "editor") openSettings(); else renderSetModal(true);
  render(); toast("Area removed 🗑️");
}

function deleteSub(catId, subId){
  var c = cat(catId);
  if(c.subs.length < 2){ toast("Every area needs at least one group 🙂"); return; }
  var s = sub(catId, subId), n = tasksIn({cat:catId, sub:subId}).length;
  if(!confirm('Remove the group "'+s.name+'"'+(n ? ' and its '+n+' task'+(n===1?"":"s") : "")+'? This cannot be undone.')) return;
  c.subs = c.subs.filter(function(x){ return x.id !== subId; });
  state.tasks = state.tasks.filter(function(t){ return !(t.category === catId && t.sub === subId); });
  if(ui.openSub === subId) ui.openSub = null;
  if(ui.fSub === subId) ui.fSub = "all";
  save(); renderSetModal(true); render(); toast("Group removed 🗑️");
}

/* ============ events ============ */
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act], [data-view], [data-pick]");
  if(!b) return;

  if(b.dataset.view){ ui.view = b.dataset.view; ui.openCat = null; ui.openSub = null; render(); return; }

  if(b.dataset.pick){
    var k = b.dataset.pick;
    draft[k] = b.dataset.val;
    if(k === "category"){
      draft.sub = cat(draft.category).subs[0].id;
      var box = $("#subPicker");
      if(box) box.innerHTML = subPickerHTML();
    }
    syncPickers();
    return;
  }

  switch(b.dataset.act){
    case "open-cat":
      ui.view = "cats"; ui.openCat = b.dataset.cat; ui.openSub = null;
      render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    case "open-sub":
      ui.view = "cats"; ui.openCat = b.dataset.cat; ui.openSub = b.dataset.sub; ui.tab = "q1";
      render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    case "home": ui.openCat = null; ui.openSub = null; render(); break;
    case "tab": ui.tab = b.dataset.quad; render(); break;
    case "status": setStatus(b.dataset.id, b.dataset.status); break;
    case "add": openTask(null, {cat:b.dataset.cat, sub:b.dataset.sub, quad:b.dataset.quad}); break;
    case "edit": openTask(b.dataset.id); break;
    case "del": {
      var t = byId(b.dataset.id);
      if(t && confirm('Delete "'+t.title+'"? This cannot be undone.')){
        state.tasks = state.tasks.filter(function(x){ return x.id !== t.id; });
        save(); closeModals(); render(); toast("Task deleted 🗑️");
      }
      break;
    }
    case "save": saveTask(); break;
    case "close": closeModals(); break;
    case "to-settings": openSettings(); break;
    case "edit-cat": openEditor(b.dataset.cat, "card"); break;
    case "add-cat": addCategory(); break;
    case "add-sub": addSub(b.dataset.cat); break;
    case "del-cat": deleteCategory(b.dataset.cat); break;
    case "del-sub": deleteSub(b.dataset.cat, b.dataset.sub); break;
    case "swatch":
      cat(b.dataset.c).color = b.dataset.color;
      save(); renderSetModal(true); render(); break;
    case "reset":
      if(confirm("Reset all tasks, areas, groups and names back to the starting example? This cannot be undone.")){
        try{ localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); }catch(e){}
        state = defaults(); state.tasks = seedTasks(); state.seeded = true;
        ui.openCat = null; ui.openSub = null; ui.fCat = "all"; ui.fSub = "all"; ui.fStat = "all"; ui.search = "";
        save(); closeModals(); render(); toast("Fresh start ✨");
      }
      break;
    case "stat":
      ui.view = "all"; ui.openCat = null; ui.openSub = null;
      ui.fStat = b.dataset.val; ui.fCat = "all"; ui.fSub = "all"; ui.search = "";
      render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    case "clear-filters":
      ui.fStat = "all"; ui.fCat = "all"; ui.fSub = "all"; ui.search = ""; render(); break;
    case "fcat": ui.fCat = b.dataset.val; ui.fSub = "all"; render(); break;
    case "fsub": ui.fSub = b.dataset.val; render(); break;
  }
});

/* live typing: search box + every renameable label */
document.addEventListener("input", function(ev){
  var el = ev.target;
  if(el.id === "searchInput"){
    ui.search = el.value;
    var pos = el.selectionStart;
    render();
    var again = $("#searchInput");
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    return;
  }
  var key = el.dataset && el.dataset.set;
  if(!key) return;
  if(key === "cat-name"){
    cat(el.dataset.c).name = el.value || "Untitled area";
    var h = document.querySelector("#setModal .sheet-head h3");
    if(h && ui.setMode && ui.setMode.mode === "editor") h.textContent = "Edit “"+cat(el.dataset.c).name+"”";
  }
  else if(key === "cat-icon") cat(el.dataset.c).icon = el.value || "•";
  else if(key === "sub-name") sub(el.dataset.c, el.dataset.s).name = el.value || "Untitled group";
  else if(key === "sub-icon") sub(el.dataset.c, el.dataset.s).icon = el.value || "•";
  else if(key === "st-label") state.statuses[el.dataset.k].label = el.value || "Status";
  else if(key === "st-icon")  state.statuses[el.dataset.k].icon = el.value || "•";
  else if(key === "cheer")    state.cheer = el.value || "Great job! Successfully completed 🎉";
  save(); render();
});

/* backdrop click, Esc, and a couple of keyboard shortcuts */
document.addEventListener("mousedown", function(ev){
  if(ev.target.classList && ev.target.classList.contains("overlay")) closeModals();
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape"){ closeModals(); return; }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!typing && (ev.key === "n" || ev.key === "N") && $("#taskModal").hidden){ ev.preventDefault(); openTask(null,{}); }
  if(ev.key === "Enter" && (ev.metaKey || ev.ctrlKey) && !$("#taskModal").hidden) saveTask();
});

$("#addBtn").addEventListener("click", function(){ openTask(null,{}); });
$("#fabBtn").addEventListener("click", function(){ openTask(null,{}); });
$("#settingsBtn").addEventListener("click", function(){ openSettings(); });
$("#themeBtn").addEventListener("click", function(){
  state.theme = state.theme === "dark" ? "light" : "dark"; save(); render();
});

render();
})();
</script>
</body>
</html>
